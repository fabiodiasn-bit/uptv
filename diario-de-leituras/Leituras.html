<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#faf8ff">
<title>Leituras</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --p50:#f7f3ff; --p100:#ede4ff; --p200:#dccbff; --p300:#c3a6fa; --p400:#a07cf5; --p500:#8b5cf0; --p600:#6b3fd0; --p700:#4b2a9e; --p800:#351d73; --p900:#241350;
  --bg:#faf8ff; --card:#ffffff; --ink:#1a1a1a; --muted:#7a7390; --line:#e9e2f7;
  --btn:rgba(0,0,0,.9);
  --star:#6b3fd0; --star-off:#e3d9f7;
  --grad:linear-gradient(135deg,#241350 0%,#4b2a9e 45%,#8b5cf0 100%);
  --shadow:0 1px 2px rgba(36,19,80,.04),0 10px 30px rgba(75,42,158,.08);
  --serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --sans:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;color:var(--ink);font:15px/1.55 var(--sans);-webkit-font-smoothing:antialiased;
  background:radial-gradient(900px 420px at 85% -80px,var(--p100),transparent 70%),radial-gradient(700px 400px at -10% 30%,#f1eaff,transparent 70%),var(--bg);background-attachment:fixed}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:780px;margin:0 auto;padding:22px 20px 80px}
.view{animation:in .5s cubic-bezier(.2,.7,.2,1)}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:26px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-size:27px;font-weight:600;letter-spacing:.01em}
.logo{width:30px;height:30px;border-radius:10px;background:var(--grad);display:grid;place-items:center;color:#fff;font-size:15px;box-shadow:0 4px 12px rgba(107,63,208,.35)}
.nav{display:flex;align-items:center;gap:10px}
.me{display:flex;align-items:center;gap:10px;padding:4px 14px 4px 4px;background:var(--card);border:1px solid var(--line);border-radius:999px;font-size:13px;color:var(--muted);transition:border-color .2s,box-shadow .2s}
.me:hover{border-color:var(--p300);box-shadow:var(--shadow)}
.avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--p300),var(--p600));display:grid;place-items:center;font-family:var(--serif);font-size:18px;font-weight:600;color:#fff;overflow:hidden;flex:none}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar.lg{width:112px;height:112px;font-size:48px;border:4px solid #fff;box-shadow:var(--shadow)}

/* type */
h1,h2{font-family:var(--serif);font-weight:600;margin:0}
h1{font-size:40px;line-height:1.06;letter-spacing:-.01em}
h2{font-size:22px}
.sh{font-size:25px;margin:0 0 16px;display:flex;align-items:center;gap:12px}
.sh::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--p200),transparent)}
.muted{color:var(--muted)}
.sec{margin-top:40px}

/* hero */
.hero-card{background:var(--grad);color:#fff;border-radius:28px;padding:28px 28px 26px;box-shadow:0 18px 40px rgba(75,42,158,.28);position:relative;overflow:hidden}
.hero-card::before,.hero-card::after{content:"";position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.18),transparent 70%)}
.hero-card::before{width:340px;height:340px;right:-90px;top:-150px}
.hero-card::after{width:240px;height:240px;left:30%;bottom:-170px}
.hero-card>*{position:relative}
.year{display:flex;align-items:center;gap:14px}
.year .y{font-family:var(--serif);font-size:64px;font-weight:500;line-height:1;letter-spacing:-.02em}
.arrow{border:0;background:rgba(255,255,255,.14);color:#fff;width:34px;height:34px;border-radius:50%;font-size:20px;line-height:1;cursor:pointer;transition:background .2s}
.arrow:hover{background:rgba(255,255,255,.26)}
.lede{margin:6px 0 20px;color:var(--p200);font-size:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.stat{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(6px);border-radius:18px;padding:14px 16px}
.stat b{display:block;font-family:var(--serif);font-size:32px;font-weight:600;line-height:1.1}
.stat span{font-size:12px;color:var(--p200)}
.stats.light .stat{background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);backdrop-filter:none}
.stats.light .stat b{color:var(--p700)}
.stats.light .stat span{color:var(--muted)}

/* covers */
.cover{display:flex;flex-direction:column;justify-content:space-between;aspect-ratio:2/3;border-radius:6px 12px 12px 6px;padding:16px 14px 14px 18px;color:#fff;background:linear-gradient(160deg,var(--a),var(--c));position:relative;overflow:hidden;box-shadow:0 10px 24px rgba(75,42,158,.25);text-shadow:0 1px 6px rgba(20,10,50,.35)}
.cover::before{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;background:linear-gradient(90deg,rgba(0,0,0,.22),rgba(255,255,255,.12) 60%,transparent)}
.cover::after{content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.14)}
.cover b{font-family:var(--serif);font-size:21px;line-height:1.1;font-weight:600;position:relative;z-index:1}
.cover i{font-style:normal;font-size:11px;letter-spacing:.06em;text-transform:uppercase;opacity:.85;position:relative;z-index:1}
.cover.sm{width:64px;padding:8px 6px 7px 11px;border-radius:4px 8px 8px 4px}
.cover.sm b{font-size:11px}.cover.sm i{display:none}
.cover.lg{width:170px}.cover.lg b{font-size:26px}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:22px}
.stack{display:grid;gap:14px}
.card.reading{display:flex;gap:18px;align-items:center;transition:transform .25s,box-shadow .25s}
.card.reading:hover,.tile:hover .cover{transform:translateY(-3px)}
.grow{flex:1;min-width:0}
.t{font-family:var(--serif);font-size:22px;line-height:1.15;font-weight:600}
.a{font-size:13px;color:var(--muted)}
.pc{font-size:12px;color:var(--muted);margin-top:6px}
.bar{height:6px;background:var(--p100);border-radius:6px;overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--p400),var(--p700));border-radius:6px;transition:width .7s cubic-bezier(.2,.7,.2,1)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:22px 18px}
.tile .cover{transition:transform .3s,box-shadow .3s}
.tile:hover .cover{box-shadow:0 16px 30px rgba(75,42,158,.32)}
.tm{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-top:12px;font-size:12px;color:var(--muted)}
.empty{color:var(--muted);padding:26px;text-align:center;font-family:var(--serif);font-size:20px;font-style:italic;background:var(--card);border:1px dashed var(--p200);border-radius:20px}
.wants{display:flex;flex-wrap:wrap;gap:10px}
.want{display:inline-flex;flex-direction:column;padding:10px 16px;background:var(--card);border:1px solid var(--line);border-radius:16px;transition:border-color .2s,transform .2s}
.want:hover{border-color:var(--p400);transform:translateY(-2px)}
.want .t{font-size:18px}

/* stars */
.stars{display:inline-flex;font-size:14px;letter-spacing:1px;line-height:1;vertical-align:middle}
.stars i{font-style:normal;background:linear-gradient(90deg,var(--star) var(--f),var(--star-off) var(--f));-webkit-background-clip:text;background-clip:text;color:transparent}
.stars.input{font-size:38px;cursor:pointer;letter-spacing:5px;user-select:none;touch-action:none}
.stars.big{font-size:24px;letter-spacing:3px}

/* buttons / fields */
.btn{border:1px solid var(--btn);background:var(--btn);color:#fff;border-radius:14px;padding:11px 22px;cursor:pointer;font-size:14px;font-weight:500;transition:transform .2s,box-shadow .2s,background .2s}
.btn:hover{box-shadow:0 8px 20px rgba(0,0,0,.22);transform:translateY(-1px)}
.btn:active{transform:scale(.98)}
.btn.sm{padding:9px 16px;font-size:13px}
.btn.ghost{background:var(--card);color:var(--btn);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--p500);box-shadow:none}
.btn.danger{background:none;border-color:transparent;color:#b3412f}
.btn.danger:hover{box-shadow:none;background:#fdeeee}
.link{background:none;border:0;padding:0;color:var(--p600);cursor:pointer;font-size:13px;font-weight:500}
.link:hover{text-decoration:underline}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:22px}
label{display:block;font-size:12px;font-weight:500;color:var(--muted);margin:16px 0 6px}
input[type=text],input[type=number],input[type=date],select,textarea{width:100%;border:1px solid var(--line);background:var(--p50);padding:11px 14px;outline:none;border-radius:12px;transition:border-color .2s,box-shadow .2s,background .2s}
input:focus,select:focus,textarea:focus{border-color:var(--p500);background:#fff;box-shadow:0 0 0 4px rgba(139,92,240,.14)}
textarea{resize:vertical;min-height:100px;line-height:1.6}
select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}

/* book */
.back{font-size:13px;font-weight:500;color:var(--p600);display:inline-block;margin-bottom:20px}
.back:hover{text-decoration:underline}
.bookhead{display:flex;gap:30px;align-items:flex-end;padding:30px;background:linear-gradient(135deg,#fff 0%,var(--p50) 100%)}
.chip{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--p700);background:var(--p100);padding:5px 12px;border-radius:999px;margin-bottom:14px}
.by{font-family:var(--serif);font-size:23px;font-style:italic;color:var(--muted);margin:8px 0 0}
.meta{font-size:13px;color:var(--muted);margin:12px 0 0}
.review{font-family:var(--serif);font-size:22px;line-height:1.55;white-space:pre-wrap;margin:16px 0 0;padding-left:18px;border-left:3px solid var(--p300)}
.log{list-style:none;margin:0;padding:0 0 0 12px;border-left:2px solid var(--p100)}
.log li{position:relative;padding:0 0 20px 22px}
.log li:last-child{padding-bottom:0}
.log li::before{content:"";position:absolute;left:-8px;top:5px;width:12px;height:12px;border-radius:50%;background:linear-gradient(135deg,var(--p400),var(--p700));border:2px solid #fff;box-shadow:0 0 0 1px var(--p200)}
.log .d{font-size:12px;font-weight:500;color:var(--p600);display:flex;gap:8px;align-items:center}
.log .n{margin-top:3px;white-space:pre-wrap}
.log .x{opacity:0;background:none;border:0;color:var(--muted);cursor:pointer;font-size:13px;padding:0;transition:opacity .2s}
.log li:hover .x{opacity:1}
@media (hover:none){.log .x{opacity:.6}}
.quick{display:grid;grid-template-columns:110px 1fr auto;gap:12px;align-items:end;margin-top:6px}
.quick label{margin-top:0}
.rrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}

/* profile */
.banner{height:150px;border-radius:28px 28px 0 0;background:var(--grad);position:relative;overflow:hidden}
.banner::after{content:"";position:absolute;width:320px;height:320px;right:-80px;top:-160px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.2),transparent 70%)}
.pcard{border-radius:0 0 28px 28px;padding:0 28px 26px}
.hero{position:relative;z-index:1;display:flex;gap:22px;align-items:flex-start;margin-top:-56px;flex-wrap:wrap}
.hero h1{font-size:38px}
.bio{font-family:var(--serif);font-size:20px;color:var(--muted);margin:4px 0 0;max-width:44ch}
.favs{display:grid;grid-template-columns:repeat(auto-fill,minmax(122px,1fr));gap:20px 16px;margin:0;padding:0;list-style:none}
.favs li{position:relative}
.favs .rank{position:absolute;z-index:2;left:-6px;top:-8px;width:28px;height:28px;border-radius:50%;background:var(--btn);color:#fff;display:grid;place-items:center;font-family:var(--serif);font-size:16px;font-weight:600;box-shadow:0 4px 10px rgba(0,0,0,.25);border:2px solid #fff}
.favs .cover b{font-size:17px}
.years{display:grid;gap:12px}
.yr{display:grid;grid-template-columns:54px 1fr 70px;align-items:center;gap:14px;cursor:pointer;font-size:13px;color:var(--muted)}
.yr b{font-family:var(--serif);font-size:22px;color:var(--ink)}
.yr .bar{margin:0}
.yr:hover .bar i{filter:brightness(1.15)}

/* dialog */
dialog{border:0;border-radius:26px;background:var(--card);color:var(--ink);padding:30px 28px 26px;width:min(500px,calc(100vw - 24px));max-height:calc(100dvh - 32px);box-shadow:0 30px 80px rgba(36,19,80,.35);overflow:auto}
dialog::backdrop{background:rgba(36,19,80,.45);backdrop-filter:blur(5px)}
dialog[open]{animation:in .3s cubic-bezier(.2,.7,.2,1)}
dialog h2{font-size:28px}
.photo{display:flex;align-items:center;gap:18px;margin-top:12px}
.photo .avatar.lg{width:84px;height:84px;font-size:36px}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:var(--btn);color:#fff;padding:11px 22px;border-radius:14px;font-size:13px;opacity:0;pointer-events:none;transition:.3s;z-index:10;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media (max-width:560px){
  .wrap{padding:16px 14px 70px}
  h1{font-size:32px}.year .y{font-size:50px}.hero-card{padding:22px 18px;border-radius:24px}
  .stat{padding:12px}.stat b{font-size:26px}
  .bookhead{flex-direction:column;align-items:flex-start;padding:22px}.cover.lg{width:140px}
  .quick{grid-template-columns:90px 1fr}.quick .btn{grid-column:1/-1}
  .me span.nm{display:none}.me{padding:4px}
  .pcard{padding:0 18px 22px}.hero{flex-direction:column;align-items:flex-start;gap:12px}
  .btn.sm.add-l{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.hero .who{padding-top:66px;flex:1;min-width:200px}
.hero #editp{margin-top:66px}
@media (max-width:560px){.hero .who,.hero #editp{padding-top:0;margin-top:0}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<dialog id="dlg"></dialog>
<div class="toast" id="toast"></div>

<script>
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KEY = 'leituras:v1';
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const pad = n => String(n).padStart(2, '0');
const today = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const parseD = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const fmtD = (s, withYear) => s ? parseD(s).toLocaleDateString('pt-BR', { day: 'numeric', month: 'short', ...(withYear ? { year: 'numeric' } : {}) }).replace('.', '') : '';
const fmtR = r => String(r).replace('.', ',');

let db = load();
let year = new Date().getFullYear();

function load() {
  try { const d = JSON.parse(localStorage.getItem(KEY)); if (d && Array.isArray(d.books)) return { profile: { name: '', bio: '', photo: '', favorites: [], ...d.profile }, books: d.books }; } catch {}
  return { profile: { name: '', bio: '', photo: '', favorites: [] }, books: [] };
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch { toast('Não foi possível salvar: armazenamento cheio.'); } }
let tt; function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 2400); }

/* ---------- domain ---------- */
const getBook = id => db.books.find(b => b.id === id);
const lastPage = b => (b.log || []).reduce((m, e) => Math.max(m, e.page || 0), 0);
const pct = b => b.pages ? Math.min(100, Math.round(lastPage(b) / b.pages * 100)) : 0;
const bookYear = b => Number((b.status === 'read' ? (b.finishedAt || b.addedAt) : (b.startedAt || b.addedAt)).slice(0, 4));
const avg = list => { const r = list.filter(b => b.rating > 0); return r.length ? (r.reduce((s, b) => s + b.rating, 0) / r.length) : 0; };
const stars = (r, cls = '') => `<span class="stars ${cls}" role="img" aria-label="${r} de 5 estrelas">${[0,1,2,3,4].map(i => `<i style="--f:${Math.max(0, Math.min(1, r - i)) * 100}%">★</i>`).join('')}</span>`;
const avatar = (cls = '') => db.profile.photo
  ? `<span class="avatar ${cls}"><img src="${db.profile.photo}" alt=""></span>`
  : `<span class="avatar ${cls}">${esc((db.profile.name || 'L').trim()[0].toUpperCase())}</span>`;

/* ---------- views ---------- */
const hashN = s => { let h = 7; for (const c of s) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h; };
const PAL = [['#a07cf5','#6b3fd0'],['#8b5cf0','#4b2a9e'],['#7c4dde','#2e175f'],['#b08af7','#7c4dde'],['#6b3fd0','#241350'],['#9d78ee','#43228a']];
const cover = (b, cls = '') => { const [x, y] = PAL[hashN(b.title) % PAL.length]; return `<span class="cover ${cls}" style="--a:${x};--c:${y}"><b>${esc(b.title)}</b><i>${esc(b.author)}</i></span>`; };

function header() {
  return `<header class="top"><a class="brand" href="#/"><span class="logo">✦</span>Leituras</a>
    <nav class="nav"><button class="btn sm" id="add">+ Novo livro</button>
    <a class="me" href="#/perfil">${avatar()}<span class="nm">${esc(db.profile.name || 'Meu perfil')}</span></a></nav></header>`;
}
const tile = b => `<a class="tile" href="#/livro/${b.id}">${cover(b)}<div class="tm">${b.rating > 0 ? stars(b.rating) : '<span></span>'}<span>${fmtD(b.finishedAt)}</span></div></a>`;

function home() {
  const years = [...new Set([new Date().getFullYear(), ...db.books.map(bookYear)])].sort((a, b) => b - a);
  const min = years[years.length - 1], max = years[0];
  if (year > max) year = max; if (year < min) year = min;
  const reading = db.books.filter(b => b.status === 'reading');
  const read = db.books.filter(b => b.status === 'read' && bookYear(b) === year).sort((a, b) => (b.finishedAt || '').localeCompare(a.finishedAt || ''));
  const want = db.books.filter(b => b.status === 'want');
  const pages = read.reduce((s, b) => s + (b.pages || 0), 0);
  const a = avg(read);
  return `${header()}<main class="view">
    <section class="hero-card">
      <div class="year">
        <button class="arrow" data-year="-1" aria-label="Ano anterior" ${year <= min ? 'disabled style="opacity:.3;cursor:default"' : ''}>‹</button>
        <span class="y">${year}</span>
        <button class="arrow" data-year="1" aria-label="Próximo ano" ${year >= max ? 'disabled style="opacity:.3;cursor:default"' : ''}>›</button>
      </div>
      <p class="lede">${read.length ? 'Seu ano em livros' : 'Suas leituras deste ano aparecem aqui'}</p>
      <div class="stats">
        <div class="stat"><b>${read.length}</b><span>${read.length === 1 ? 'livro lido' : 'livros lidos'}</span></div>
        <div class="stat"><b>${pages.toLocaleString('pt-BR')}</b><span>páginas</span></div>
        <div class="stat"><b>${a ? fmtR(a.toFixed(1)) : '—'}</b><span>nota média</span></div>
      </div>
    </section>

    ${reading.length ? `<section class="sec"><h2 class="sh">Lendo agora</h2><div class="stack">
      ${reading.map(b => `<a class="card reading" href="#/livro/${b.id}">${cover(b, 'sm')}<div class="grow"><div class="t">${esc(b.title)}</div><div class="a">${esc(b.author)}</div>
        ${b.pages ? `<div class="bar"><i style="width:${pct(b)}%"></i></div><div class="pc">${pct(b)}% · página ${lastPage(b)} de ${b.pages}</div>` : lastPage(b) ? `<div class="pc">página ${lastPage(b)}</div>` : ''}</div></a>`).join('')}</div></section>` : ''}

    <section class="sec"><h2 class="sh">Lidos em ${year}</h2>
      ${read.length ? `<div class="grid">${read.map(tile).join('')}</div>` : `<div class="empty">Nenhuma leitura concluída em ${year} ainda.</div>`}</section>

    ${want.length ? `<section class="sec"><h2 class="sh">Para ler</h2><div class="wants">
      ${want.map(b => `<a class="want" href="#/livro/${b.id}"><span class="t">${esc(b.title)}</span><span class="a">${esc(b.author)}</span></a>`).join('')}</div></section>` : ''}
  </main>`;
}

function bookView(id) {
  const b = getBook(id);
  if (!b) return `${header()}<main class="view"><p class="empty">Livro não encontrado.</p><a class="link" href="#/">Voltar</a></main>`;
  const label = { want: 'Para ler', reading: 'Lendo', read: 'Lido' }[b.status];
  const log = [...(b.log || [])].sort((x, y) => y.date.localeCompare(x.date) || y.id.localeCompare(x.id));
  const meta = [b.pages ? b.pages + ' páginas' : '', b.startedAt ? 'iniciado em ' + fmtD(b.startedAt, true) : '', b.status === 'read' && b.finishedAt ? 'concluído em ' + fmtD(b.finishedAt, true) : ''].filter(Boolean).join(' · ');
  return `${header()}<a class="back" href="#/">← Voltar</a><main class="view">
    <section class="card bookhead">${cover(b, 'lg')}<div>
      <span class="chip">${label}</span><h1>${esc(b.title)}</h1>
      ${b.author ? `<p class="by">${esc(b.author)}</p>` : ''}${meta ? `<p class="meta">${meta}</p>` : ''}
      <div class="actions">
        ${b.status === 'want' ? `<button class="btn" id="start">Começar a ler</button>` : ''}
        ${b.status === 'reading' ? `<button class="btn" id="finish">Concluí a leitura</button>` : ''}
        <button class="btn ghost" id="edit">Editar livro</button>
      </div></div></section>

    ${b.status === 'read' ? `<section class="card sec" style="margin-top:20px">
      <div class="rrow">${stars(b.rating || 0, 'big')}<span class="muted" style="font-size:13px">${b.rating > 0 ? fmtR(b.rating) + ' de 5' : 'sem nota'}</span></div>
      ${b.review ? `<p class="review">${esc(b.review)}</p>` : `<p class="muted" style="margin:14px 0 0">Ainda sem resenha.</p>`}
      <div class="actions"><button class="btn ghost sm" id="finish">${b.review || b.rating ? 'Editar resenha' : 'Escrever resenha'}</button></div></section>` : ''}

    ${b.status === 'reading' ? `<section class="card" style="margin-top:20px">
      <h2 class="sh" style="font-size:22px">Registrar leitura</h2>
      ${b.pages ? `<div style="display:flex;justify-content:space-between;font-size:13px" class="muted"><span>${lastPage(b)} de ${b.pages} páginas</span><span>${pct(b)}%</span></div><div class="bar"><i style="width:${pct(b)}%"></i></div>` : ''}
      <form id="logf" class="quick" style="margin-top:18px">
        <div><label for="lp">Página</label><input id="lp" type="number" min="0" inputmode="numeric" placeholder="${lastPage(b) || ''}"></div>
        <div><label for="ln">Como está sendo?</label><input id="ln" type="text" placeholder="Uma anotação, uma citação…"></div>
        <button class="btn" type="submit">Registrar</button>
      </form></section>` : ''}

    ${log.length ? `<section class="card" style="margin-top:20px"><h2 class="sh" style="font-size:22px">Histórico de leitura</h2><ul class="log">
      ${log.map(e => `<li><div class="d"><span>${fmtD(e.date, true)}</span>${e.page ? `<span>· pág. ${e.page}</span>` : ''}<button class="x" data-del="${e.id}" aria-label="Remover registro">✕</button></div>${e.note ? `<div class="n">${esc(e.note)}</div>` : ''}</li>`).join('')}</ul></section>` : ''}
  </main>`;
}

function profileView() {
  const p = db.profile, read = db.books.filter(b => b.status === 'read');
  const favs = (p.favorites || []).map(getBook).filter(Boolean);
  const byYear = {}; read.forEach(b => { const y = bookYear(b); byYear[y] = (byYear[y] || 0) + 1; });
  const mx = Math.max(1, ...Object.values(byYear));
  const a = avg(read);
  return `${header()}<a class="back" href="#/">← Voltar</a><main class="view">
    <section class="card" style="padding:0;overflow:hidden"><div class="banner"></div><div class="pcard">
      <div class="hero">${avatar('lg')}<div class="who"><h1>${esc(p.name || 'Seu nome')}</h1>${p.bio ? `<p class="bio">${esc(p.bio)}</p>` : ''}</div>
      <button class="btn ghost sm" id="editp">Editar perfil</button></div></div></section>

    <div class="stats light" style="margin-top:20px">
      <div class="stat"><b>${read.length}</b><span>livros lidos</span></div>
      <div class="stat"><b>${read.reduce((s, b) => s + (b.pages || 0), 0).toLocaleString('pt-BR')}</b><span>páginas</span></div>
      <div class="stat"><b>${a ? fmtR(a.toFixed(1)) : '—'}</b><span>nota média</span></div>
    </div>

    <section class="sec"><h2 class="sh">Top favoritos</h2>
      ${favs.length ? `<ol class="favs">${favs.map((b, i) => `<li><span class="rank">${i + 1}</span><a href="#/livro/${b.id}">${cover(b)}</a></li>`).join('')}</ol>` : `<div class="empty">Escolha até cinco livros em “Editar perfil”.</div>`}</section>

    ${Object.keys(byYear).length ? `<section class="sec"><h2 class="sh">Ano a ano</h2><div class="card years">
      ${Object.keys(byYear).sort((x, y) => y - x).map(y => `<div class="yr" data-goyear="${y}"><b>${y}</b><div class="bar"><i style="width:${byYear[y] / mx * 100}%"></i></div><span>${byYear[y]} ${byYear[y] === 1 ? 'livro' : 'livros'}</span></div>`).join('')}</div></section>` : ''}

    <section class="sec"><h2 class="sh">Seus dados</h2><div class="card">
      <p class="muted" style="margin:0;font-size:13px;max-width:52ch">Tudo fica salvo neste aparelho, neste navegador. Exporte um backup de tempos em tempos, ou para levar seu perfil para outro aparelho.</p>
      <div class="actions" style="margin-top:16px"><button class="btn ghost sm" id="exp">Exportar backup</button><button class="btn ghost sm" id="imp">Importar backup</button><input type="file" id="impf" accept="application/json" hidden></div></div></section>
  </main>`;
}

/* ---------- dialogs ---------- */
const dlg = $('#dlg');
function openDlg(html) { dlg.innerHTML = html; if (!dlg.open) dlg.showModal(); return dlg; }
function closeDlg() { if (dlg.open) dlg.close(); }
dlg.addEventListener('click', e => { if (e.target === dlg) closeDlg(); });

function ratingInput(v) { return `<div class="stars input" id="ri" data-v="${v}" role="slider" aria-label="Nota" aria-valuemin="0" aria-valuemax="5" aria-valuenow="${v}" tabindex="0">${[0,1,2,3,4].map(i => `<i style="--f:${Math.max(0, Math.min(1, v - i)) * 100}%">★</i>`).join('')}</div><span class="muted" id="rv" style="margin-left:12px;font-size:13px">${v > 0 ? fmtR(v) + ' de 5' : 'toque para dar nota'}</span>`; }
function wireRating(root) {
  const el = $('#ri', root), out = $('#rv', root);
  const set = v => { el.dataset.v = v; el.setAttribute('aria-valuenow', v); [...el.children].forEach((c, i) => c.style.setProperty('--f', Math.max(0, Math.min(1, v - i)) * 100 + '%')); out.textContent = v > 0 ? fmtR(v) + ' de 5' : 'toque para dar nota'; };
  el.addEventListener('click', e => {
    const r = el.getBoundingClientRect();
    let v = Math.ceil(Math.max(0.01, Math.min(1, (e.clientX - r.left) / r.width)) * 10) / 2;
    set(v === Number(el.dataset.v) ? 0 : v);
  });
  el.addEventListener('keydown', e => {
    const c = Number(el.dataset.v);
    if (e.key === 'ArrowRight' || e.key === 'ArrowUp') { e.preventDefault(); set(Math.min(5, c + .5)); }
    if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') { e.preventDefault(); set(Math.max(0, c - .5)); }
  });
}

function bookDialog(id) {
  const b = id ? getBook(id) : { title: '', author: '', pages: '', status: 'reading', finishedAt: today() };
  const d = openDlg(`<form id="bf"><h2>${id ? 'Editar livro' : 'Novo livro'}</h2>
    <label for="bt">Título</label><input id="bt" type="text" required value="${esc(b.title)}" autocomplete="off">
    <label for="ba">Autor(a)</label><input id="ba" type="text" value="${esc(b.author)}" autocomplete="off">
    <div class="two"><div><label for="bp">Páginas</label><input id="bp" type="number" min="1" inputmode="numeric" value="${b.pages || ''}"></div>
    <div><label for="bs">Situação</label><select id="bs"><option value="reading">Lendo</option><option value="want">Quero ler</option><option value="read">Já li</option></select></div></div>
    <div id="bdw"><label for="bd">Concluído em</label><input id="bd" type="date" value="${b.finishedAt || today()}"></div>
    <div class="actions"><button class="btn" type="submit">Salvar</button><button class="btn ghost" type="button" id="cx">Cancelar</button>
    ${id ? `<button class="btn danger" type="button" id="rm" style="margin-left:auto">Excluir</button>` : ''}</div></form>`);
  const s = $('#bs', d); s.value = b.status;
  const sync = () => { $('#bdw', d).style.display = s.value === 'read' ? '' : 'none'; }; sync(); s.onchange = sync;
  $('#cx', d).onclick = closeDlg;
  if (id) $('#rm', d).onclick = () => {
    if (!confirm(`Excluir “${b.title}” e todo o seu histórico?`)) return;
    db.books = db.books.filter(x => x.id !== id); db.profile.favorites = db.profile.favorites.filter(f => f !== id);
    save(); closeDlg(); location.hash = '#/';
  };
  $('#bf', d).onsubmit = e => {
    e.preventDefault();
    const status = s.value, t = today();
    const data = { title: $('#bt', d).value.trim(), author: $('#ba', d).value.trim(), pages: Number($('#bp', d).value) || 0 };
    if (!data.title) return;
    let nb = b;
    if (id) Object.assign(b, data); else { nb = { id: uid(), addedAt: t, log: [], rating: 0, review: '', ...data }; db.books.push(nb); }
    if (status !== nb.status || !id) {
      nb.status = status;
      if (status === 'reading' && !nb.startedAt) nb.startedAt = t;
    }
    if (nb.status === 'read') nb.finishedAt = $('#bd', d).value || t;
    save(); closeDlg(); if (id) render(); else location.hash = '#/livro/' + nb.id;
    if (!id) render();
  };
  $('#bt', d).focus();
}

function finishDialog(id) {
  const b = getBook(id), wasRead = b.status === 'read';
  const d = openDlg(`<form id="ff"><h2>${wasRead ? 'Sua resenha' : 'Leitura concluída'}</h2><p class="muted" style="margin:0 0 18px;font-family:var(--serif);font-size:19px;font-style:italic">${esc(b.title)}</p>
    <div>${ratingInput(b.rating || 0)}</div>
    <label for="fr">O que você achou?</label><textarea id="fr" placeholder="Escreva do seu jeito…">${esc(b.review)}</textarea>
    <label for="fd">Concluído em</label><input id="fd" type="date" value="${b.finishedAt || today()}">
    <div class="actions"><button class="btn" type="submit">Salvar</button><button class="btn ghost" type="button" id="cx">${wasRead ? 'Cancelar' : 'Ainda não'}</button></div></form>`);
  wireRating(d); $('#cx', d).onclick = closeDlg;
  $('#ff', d).onsubmit = e => {
    e.preventDefault();
    b.rating = Number($('#ri', d).dataset.v) || 0; b.review = $('#fr', d).value.trim();
    b.status = 'read'; b.finishedAt = $('#fd', d).value || today();
    if (b.pages && lastPage(b) < b.pages) { /* keep log as is */ }
    save(); closeDlg(); render(); toast(wasRead ? 'Resenha salva' : 'Leitura concluída ✓');
  };
}

function profileDialog() {
  const p = db.profile; let photo = p.photo;
  const opts = sel => `<option value="">—</option>` + db.books.map(b => `<option value="${b.id}" ${b.id === sel ? 'selected' : ''}>${esc(b.title)}</option>`).join('');
  const d = openDlg(`<form id="pf"><h2>Seu perfil</h2>
    <div class="photo"><span id="ph"></span><div><button class="btn ghost" type="button" id="pickph">Escolher foto</button> <button class="link" type="button" id="rmph">remover</button><input type="file" id="phf" accept="image/*" hidden></div></div>
    <label for="pn">Nome</label><input id="pn" type="text" value="${esc(p.name)}" autocomplete="off">
    <label for="pb">Sobre você</label><textarea id="pb" style="min-height:64px" placeholder="Uma frase sobre suas leituras">${esc(p.bio)}</textarea>
    <label>Top livros favoritos</label>
    ${[0,1,2,3,4].map(i => `<select class="fv" style="margin-bottom:4px" aria-label="Favorito ${i + 1}">${opts((p.favorites || [])[i])}</select>`).join('')}
    ${db.books.length ? '' : '<p class="muted" style="font-size:12px">Adicione livros à sua biblioteca para escolhê-los aqui.</p>'}
    <div class="actions"><button class="btn" type="submit">Salvar</button><button class="btn ghost" type="button" id="cx">Cancelar</button></div></form>`);
  const showPh = () => { $('#ph', d).innerHTML = photo ? `<span class="avatar lg"><img src="${photo}" alt=""></span>` : `<span class="avatar lg">${esc(($('#pn', d).value || 'L').trim()[0]?.toUpperCase() || 'L')}</span>`; };
  showPh();
  $('#pickph', d).onclick = () => $('#phf', d).click();
  $('#rmph', d).onclick = () => { photo = ''; showPh(); };
  $('#phf', d).onchange = e => {
    const f = e.target.files[0]; if (!f) return;
    const img = new Image(), url = URL.createObjectURL(f);
    img.onload = () => {
      const S = 320, c = document.createElement('canvas'); c.width = c.height = S;
      const m = Math.min(img.width, img.height), sx = (img.width - m) / 2, sy = (img.height - m) / 2;
      c.getContext('2d').drawImage(img, sx, sy, m, m, 0, 0, S, S);
      photo = c.toDataURL('image/jpeg', .85); URL.revokeObjectURL(url); showPh();
    };
    img.onerror = () => toast('Não consegui abrir essa imagem'); img.src = url;
  };
  $('#cx', d).onclick = closeDlg;
  $('#pf', d).onsubmit = e => {
    e.preventDefault();
    p.name = $('#pn', d).value.trim(); p.bio = $('#pb', d).value.trim(); p.photo = photo;
    p.favorites = [...new Set([...d.querySelectorAll('.fv')].map(s => s.value).filter(Boolean))];
    save(); closeDlg(); render();
  };
}

/* ---------- events ---------- */
function bind() {
  const app = $('#app');
  app.querySelectorAll('[data-year]').forEach(b => b.onclick = () => { if (b.disabled) return; year += Number(b.dataset.year); render(); });
  app.querySelectorAll('[data-goyear]').forEach(r => r.onclick = () => { year = Number(r.dataset.goyear); location.hash = '#/'; });
  const on = (id, fn) => { const el = $(id, app); if (el) el.onclick = fn; };
  const id = (location.hash.match(/^#\/livro\/(.+)$/) || [])[1];
  on('#add', () => bookDialog());
  on('#edit', () => bookDialog(id));
  on('#finish', () => finishDialog(id));
  on('#editp', profileDialog);
  on('#start', () => { const b = getBook(id); b.status = 'reading'; b.startedAt = b.startedAt || today(); save(); render(); });
  on('#exp', () => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(db, null, 2)], { type: 'application/json' }));
    a.download = `leituras-backup-${today()}.json`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  });
  on('#imp', () => $('#impf', app).click());
  const impf = $('#impf', app);
  if (impf) impf.onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    try {
      const d = JSON.parse(await f.text());
      if (!d || !Array.isArray(d.books)) throw 0;
      if (!confirm('Importar este backup vai substituir os dados atuais. Continuar?')) return;
      localStorage.setItem(KEY, JSON.stringify(d)); db = load(); render(); toast('Backup importado');
    } catch { toast('Arquivo de backup inválido'); }
  };
  const lf = $('#logf', app);
  if (lf) lf.onsubmit = e => {
    e.preventDefault();
    const b = getBook(id), page = Number($('#lp', app).value) || 0, note = $('#ln', app).value.trim();
    if (!page && !note) { $('#lp', app).focus(); return; }
    b.log = b.log || []; b.log.push({ id: uid(), date: today(), page, note });
    save(); render(); toast('Registrado');
  };
  app.querySelectorAll('[data-del]').forEach(x => x.onclick = () => {
    const b = getBook(id); b.log = b.log.filter(e => e.id !== x.dataset.del); save(); render();
  });
}

function render() {
  const h = location.hash;
  let m;
  const app = $('#app');
  if (h === '#/perfil') app.innerHTML = profileView();
  else if ((m = h.match(/^#\/livro\/(.+)$/))) app.innerHTML = bookView(m[1]);
  else app.innerHTML = home();
  bind();
}
let lastHash = null;
addEventListener('hashchange', () => { render(); if (location.hash !== lastHash) scrollTo(0, 0); lastHash = location.hash; });
render();
</script>
</body>
