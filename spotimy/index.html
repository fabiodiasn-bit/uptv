<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0820">
<title>Spotimy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..600&family=Inter:wght@300..600&display=swap">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20128%20128%22%20role%3D%22img%22%20aria-label%3D%22Spotimy%22%3E%3Cdefs%3E%3ClinearGradient%20id%3D%22g%22%20x1%3D%220%22%20y1%3D%220%22%20x2%3D%221%22%20y2%3D%221%22%3E%3Cstop%20offset%3D%220%22%20stop-color%3D%22%237c3aed%22/%3E%3Cstop%20offset%3D%221%22%20stop-color%3D%22%2306b6d4%22/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle%20cx%3D%2264%22%20cy%3D%2264%22%20r%3D%2260%22%20fill%3D%22url%28%23g%29%22/%3E%3Cg%20fill%3D%22%23fff%22%3E%3Crect%20x%3D%2230%22%20y%3D%2262%22%20width%3D%2212%22%20height%3D%2228%22%20rx%3D%226%22/%3E%3Crect%20x%3D%2249%22%20y%3D%2242%22%20width%3D%2212%22%20height%3D%2260%22%20rx%3D%226%22/%3E%3Crect%20x%3D%2268%22%20y%3D%2252%22%20width%3D%2212%22%20height%3D%2244%22%20rx%3D%226%22/%3E%3Crect%20x%3D%2287%22%20y%3D%2268%22%20width%3D%2212%22%20height%3D%2220%22%20rx%3D%226%22/%3E%3C/g%3E%3Ccircle%20cx%3D%2293%22%20cy%3D%2242%22%20r%3D%229%22%20fill%3D%22%23fff%22/%3E%3C/svg%3E">
<style>
*{box-sizing:border-box}
:root{--bg:#000;--panel:#121212;--panel2:#1a1a1a;--hover:#2a2a2a;--line:#2a2a2a;--text:#fff;--muted:#a7a7a7;--accent:#a78bfa;--accent2:#c4b5fd}
html,body{margin:0;height:100%;background:#000;color:var(--text);font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
svg{width:1em;height:1em;fill:currentColor;display:block}
input{font:inherit;color:inherit}
.app{height:100dvh;display:grid;grid-template-columns:260px 1fr;grid-template-rows:1fr 90px;gap:8px;padding:8px}
.side{grid-row:1;display:flex;flex-direction:column;gap:8px;min-height:0}
.box{background:var(--panel);border-radius:10px}
.nav{padding:8px 12px}
.logo{display:flex;align-items:center;gap:12px;padding:12px;font-weight:800;font-size:26px;letter-spacing:-.5px}
.logo svg{flex:none}
.logo span{background:linear-gradient(90deg,#c4b5fd,#67e8f9);-webkit-background-clip:text;background-clip:text;color:transparent}
.nav button{display:flex;align-items:center;gap:16px;width:100%;padding:10px 12px;border-radius:8px;color:var(--muted);font-weight:700;font-size:15px}
.nav button svg{font-size:24px}
.nav button:hover,.nav button.on{color:#fff}
.lib{flex:1;min-height:0;display:flex;flex-direction:column}
.lib-h{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 8px;color:var(--muted);font-weight:700}
.lib-h button{font-size:20px;width:32px;height:32px;border-radius:50%;display:grid;place-items:center}
.lib-h button:hover{background:var(--hover);color:#fff}
.lib-l{overflow:auto;padding:0 8px 8px;flex:1}
.pli{display:flex;align-items:center;gap:12px;padding:8px;border-radius:8px;width:100%;text-align:left}
.pli:hover,.pli.on{background:var(--panel2)}
.pli small{display:block;color:var(--muted);font-size:13px}
.pli b{display:block;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pli>div{min-width:0}
.cov{flex:none;border-radius:6px;display:grid;place-items:center;font-weight:800;color:rgba(255,255,255,.85);text-shadow:0 1px 4px rgba(0,0,0,.4)}
.main{grid-row:1;grid-column:2;overflow:auto;position:relative;background:linear-gradient(180deg,#1d1540 0,var(--panel) 320px);border-radius:10px;scroll-behavior:smooth}
.pad{padding:20px 24px 40px}
h1{font-size:30px;margin:8px 0 18px;letter-spacing:-.5px}
h2{font-size:22px;margin:30px 0 14px}
.quick{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.qt{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.08);border-radius:6px;overflow:hidden;font-weight:700;text-align:left;position:relative;padding-right:12px}
.qt:hover{background:rgba(255,255,255,.16)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px}
.card{background:var(--panel2);padding:14px;border-radius:8px;text-align:left;position:relative;transition:background .2s}
.card:hover{background:var(--hover)}
.card .cov{width:100%!important;height:auto!important;aspect-ratio:1;margin-bottom:12px;font-size:44px!important;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.card .cov svg{width:34%!important;height:34%!important}
.lib-h>span:last-child{display:flex;gap:2px}
.card b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card small{display:block;color:var(--muted);margin-top:4px;font-size:13px;line-height:1.3;max-height:2.6em;overflow:hidden}
.fab{position:absolute;right:20px;bottom:76px;width:46px;height:46px;border-radius:50%;background:var(--accent);color:#000;display:grid;place-items:center;font-size:22px;opacity:0;transform:translateY(8px);transition:.2s;box-shadow:0 8px 16px rgba(0,0,0,.4)}
.card:hover .fab{opacity:1;transform:none}
.fab:hover{transform:scale(1.06);background:var(--accent2)}
.hero{display:flex;gap:24px;align-items:flex-end;padding:20px 24px 0}
.hero .cov{width:200px;height:200px;font-size:72px;box-shadow:0 10px 40px rgba(0,0,0,.6)}
.hero small{font-weight:700;font-size:13px}
.hero h1{font-size:clamp(28px,6vw,64px);margin:6px 0 10px;line-height:1.05}
.hero p{margin:0;color:var(--muted);font-size:14px}
.bar{display:flex;align-items:center;gap:20px;padding:20px 24px}
.big{width:56px;height:56px;border-radius:50%;background:var(--accent);color:#000;display:grid;place-items:center;font-size:28px}
.big:hover{transform:scale(1.05);background:var(--accent2)}
.ib{font-size:26px;color:var(--muted)}
.ib:hover{color:#fff}
.th,.row{display:grid;grid-template-columns:40px minmax(0,6fr) minmax(0,4fr) 40px 56px 36px;gap:12px;align-items:center;padding:6px 12px;border-radius:6px}
.th{color:var(--muted);font-size:13px;border-bottom:1px solid var(--line);border-radius:0;padding-bottom:10px;margin-bottom:8px;text-transform:uppercase;letter-spacing:.08em}
.row:hover{background:rgba(255,255,255,.1)}
.row .num{color:var(--muted);text-align:center}
.row .pl{display:none;font-size:18px}
.row:hover .num span{display:none}
.row:hover .pl{display:block;margin:auto;color:#fff}
.row.now .t b,.row.now .num{color:var(--accent)}
.t{display:flex;align-items:center;gap:12px;min-width:0;text-align:left}
.t b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t small{color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t>div{min-width:0}
.alb{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.dur{color:var(--muted);font-size:14px;text-align:right}
.heart{font-size:18px;color:var(--muted);opacity:0}
.row:hover .heart,.heart.on{opacity:1}
.heart.on{color:var(--accent)}
.more{font-size:20px;color:var(--muted);opacity:0}
.row:hover .more{opacity:1}
.more:hover{color:#fff}
.search{display:flex;align-items:center;gap:10px;background:#242424;border-radius:500px;padding:0 16px;height:46px;max-width:420px;border:2px solid transparent}
.search:focus-within{border-color:#fff}
.search input{flex:1;background:none;border:0;outline:0;height:100%}
.search svg{font-size:22px;color:var(--muted)}
.genres{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px}
.gn{height:110px;border-radius:8px;padding:14px;text-align:left;font-weight:800;font-size:20px;position:relative;overflow:hidden}
.gn:hover{filter:brightness(1.1)}
.empty{color:var(--muted);padding:40px 0;text-align:center}
.player{grid-column:1/-1;grid-row:2;display:grid;grid-template-columns:1fr minmax(300px,2fr) 1fr;align-items:center;padding:0 12px;background:#000}
.np{display:flex;align-items:center;gap:12px;min-width:0}
.np .cov{width:56px;height:56px;font-size:22px}
.np b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np small{color:var(--muted);font-size:12px}
.np>div{min-width:0}
.ctl{display:flex;flex-direction:column;align-items:center;gap:6px}
.btns{display:flex;align-items:center;gap:16px}
.btns .ib{font-size:22px}
.btns .on{color:var(--accent)}
.play{width:36px;height:36px;border-radius:50%;background:#fff;color:#000;display:grid;place-items:center;font-size:20px}
.play:hover{transform:scale(1.06)}
.prog{display:flex;align-items:center;gap:8px;width:100%;max-width:600px;font-size:12px;color:var(--muted)}
.prog span{width:38px;text-align:center;font-variant-numeric:tabular-nums}
.right{display:flex;justify-content:flex-end;align-items:center;gap:8px}
.right input{width:100px}
input[type=range]{-webkit-appearance:none;appearance:none;height:14px;background:none;cursor:pointer;flex:1;--v:0%}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:linear-gradient(90deg,#fff var(--v),#4d4d4d var(--v))}
input[type=range]::-moz-range-track{height:4px;border-radius:4px;background:linear-gradient(90deg,#fff var(--v),#4d4d4d var(--v))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:0;height:0}
input[type=range]:hover::-webkit-slider-runnable-track{background:linear-gradient(90deg,var(--accent) var(--v),#4d4d4d var(--v))}
input[type=range]:hover::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:#fff;margin-top:-4px}
input[type=range]:hover::-moz-range-track{background:linear-gradient(90deg,var(--accent) var(--v),#4d4d4d var(--v))}
input[type=range]::-moz-range-thumb{width:0;height:0;border:0}
input[type=range]:hover::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:#fff;border:0}
#menu{position:fixed;z-index:50;background:#282828;border-radius:8px;padding:4px;min-width:210px;max-height:60vh;overflow:auto;box-shadow:0 16px 40px rgba(0,0,0,.6);display:none}
#menu button{display:block;width:100%;text-align:left;padding:10px 12px;border-radius:4px;font-size:14px}
#menu button:hover{background:#3e3e3e}
#menu hr{border:0;border-top:1px solid #3e3e3e;margin:4px 0}
#menu .lbl{color:var(--muted);font-size:12px;padding:8px 12px 4px}
#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:#fff;color:#000;padding:10px 18px;border-radius:6px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:60}
#toast.on{opacity:1}
#queue{position:fixed;right:16px;bottom:102px;width:340px;max-width:calc(100vw - 32px);max-height:60vh;overflow:auto;background:#181818;border-radius:10px;padding:6px 12px 12px;box-shadow:0 16px 40px rgba(0,0,0,.6);display:none;z-index:40}
#queue h3{margin:10px 0 4px}
#queue .lbl{color:var(--muted);font-size:13px;margin:12px 0 4px}
.qi{display:flex;align-items:center;gap:12px;padding:6px;border-radius:6px;width:100%;text-align:left}
button.qi:hover{background:#2a2a2a}
.qi b{display:block;font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qi small{color:var(--muted);font-size:12px}
.qi>div{min-width:0}
.qi.now b{color:var(--accent)}
[hidden]{display:none!important}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px}
.chip{padding:8px 16px;border-radius:999px;background:rgba(255,255,255,.1);font-size:14px;font-weight:600}
.chip:hover{background:rgba(255,255,255,.18)}
.chip.on{background:#fff;color:#000}
.chip small{opacity:.65;font-weight:500;margin-left:6px}
#imp{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;z-index:70;padding:16px}
.impbox{background:#181818;border-radius:12px;width:min(560px,100%);max-height:86vh;display:flex;flex-direction:column;padding:16px}
.impbox h3{margin:4px 0 12px}
.impbar{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.impbar span{color:var(--muted);font-size:14px;margin-left:auto}
.implist{overflow:auto;flex:1;min-height:120px}
.impi{display:flex;gap:12px;align-items:center;padding:8px 6px;border-radius:6px;cursor:pointer}
.impi:hover{background:#2a2a2a}
.impi input{width:20px;height:20px;accent-color:var(--accent);flex:none}
.impi>div{min-width:0}
.impi b{display:block;font-weight:500;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.impi small{display:block;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.impbtn{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.chip[disabled]{opacity:.4;cursor:default}
.mnav{display:none}
@media(max-width:860px){
  .app{grid-template-columns:1fr;grid-template-rows:1fr auto auto;gap:0;padding:0}
  .side{display:none}
  .main{grid-column:1;border-radius:0}
  .player{grid-row:2;grid-template-columns:1fr auto;grid-template-rows:auto auto;padding:8px 12px 4px;gap:4px;border-top:1px solid var(--line)}
  .right{display:none}
  .ctl{display:contents}
  .btns{grid-column:2;grid-row:1}
  .btns .hide-m{display:none}
  .np{grid-column:1;grid-row:1}
  .prog{grid-column:1/-1;grid-row:2;max-width:none}
  .mnav{display:flex;grid-row:3;background:#000;padding:4px 0 max(6px,env(safe-area-inset-bottom))}
  .mnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);padding:6px}
  .mnav button.on{color:#fff}
  .mnav svg{font-size:24px}
  .th,.row{grid-template-columns:32px minmax(0,1fr) 36px 48px 30px}
  .th .alb,.row .alb{display:none}
  .pad{padding:16px 14px 30px}
  .hero{flex-direction:column;align-items:flex-start;padding:16px 14px 0}
  .hero .cov{width:140px;height:140px;font-size:54px}
  .heart{opacity:1}.more{opacity:1}
  .fab{opacity:1;transform:none}
}

/* ===== tema elegante: tipografia leve, superfícies suaves ===== */
:root{
 --bg:#08080c;--panel:#101016;--panel2:#15151d;--hover:#1c1c26;
 --line:rgba(255,255,255,.07);--text:#f3f3f6;--muted:#9b9bab;
 --accent:#b8a3ff;--accent2:#d2c6ff;--r:14px;
 --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
 --serif:"Fraunces","Cormorant Garamond",Georgia,"Times New Roman",serif;
}
html,body{background:var(--bg);font-family:var(--sans);font-size:15px;font-weight:400;line-height:1.5;letter-spacing:-.003em;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility}
b,strong{font-weight:500}
::selection{background:rgba(184,163,255,.35)}
*{scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.16) transparent}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:10px;border:3px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.26);background-clip:padding-box;border:3px solid transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--serif);font-weight:400;letter-spacing:-.015em;font-variation-settings:"opsz" 72}
h1{font-size:clamp(30px,4vw,42px);margin:6px 0 22px;line-height:1.1}
h2{font-size:24px;margin:38px 0 16px;line-height:1.2}
h3{font-size:20px}

/* estrutura */
.app{gap:10px;padding:10px;background:var(--bg)}
.box,.main{background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
.main{background:radial-gradient(900px 340px at 18% -8%,rgba(139,92,246,.20),transparent 65%),var(--panel)}
.pad{padding:26px 30px 48px}

/* logo e navegação */
.logo{font-family:var(--serif);font-weight:500;font-size:27px;letter-spacing:-.02em;padding:16px 16px 10px;gap:12px}
.nav{padding:6px 10px 12px}
.nav button{font-weight:500;font-size:14.5px;padding:10px 12px;border-radius:10px;gap:14px;transition:background .2s,color .2s}
.nav button:hover{background:rgba(255,255,255,.04)}
.nav button.on{background:rgba(255,255,255,.07);color:var(--text)}
.nav button svg{font-size:22px}
.lib-h{font-weight:500;font-size:12px;letter-spacing:.1em;text-transform:uppercase;padding:16px 18px 8px}
.lib-h button{border-radius:10px}
.pli{border-radius:10px;transition:background .2s}
.pli b{font-weight:500;font-size:14.5px}
.pli small{font-size:12.5px}

/* capas e cartões */
.cov{font-weight:400;border-radius:8px;text-shadow:none}
.quick{gap:12px}
.qt{font-weight:500;font-size:14.5px;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:12px;transition:background .2s,border-color .2s,transform .2s}
.qt:hover{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.12)}
.grid{gap:18px}
.card{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:16px;padding:14px;transition:transform .25s ease,background .25s,box-shadow .25s,border-color .25s}
.card:hover{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.1);transform:translateY(-3px);box-shadow:0 18px 38px rgba(0,0,0,.45)}
.card .cov{border-radius:10px;box-shadow:0 10px 26px rgba(0,0,0,.45)}
.card b{font-weight:500;font-size:14.5px;letter-spacing:-.005em}
.card small{font-size:12.5px;line-height:1.4;color:var(--muted)}
.fab,.big{background:linear-gradient(135deg,#cdbdff,#8f6df5);color:#0b0b12;box-shadow:0 10px 24px rgba(120,80,240,.35)}
.fab:hover,.big:hover{background:linear-gradient(135deg,#ddd2ff,#a085f7)}
.gn{font-family:var(--serif);font-weight:500;font-size:22px;letter-spacing:-.01em;border-radius:14px;border:1px solid var(--line);transition:transform .2s,filter .2s}
.gn:hover{transform:translateY(-2px)}

/* chips */
.chips{gap:8px}
.chip{background:transparent;border:1px solid rgba(255,255,255,.16);font-weight:500;font-size:13.5px;padding:7px 15px;transition:background .2s,border-color .2s,color .2s}
.chip:hover{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.26)}
.chip.on{background:var(--text);color:#0b0b12;border-color:transparent}
.chip small{font-weight:400}

/* topo de playlist */
.hero{padding:28px 30px 0}
.hero .cov{border-radius:16px;box-shadow:0 24px 60px rgba(0,0,0,.55)}
.hero h1{font-size:clamp(34px,6vw,66px);font-weight:400;line-height:1.04;letter-spacing:-.025em;margin:8px 0 12px}
.hero small{font-weight:500;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.hero p{font-size:14px}
.bar{padding:22px 30px}

/* tabela de músicas */
.th{font-size:11px;font-weight:500;letter-spacing:.12em;border-bottom:1px solid var(--line)}
.row{border-radius:10px;transition:background .15s}
.row:hover{background:rgba(255,255,255,.05)}
.t b{font-weight:500;font-size:14.5px;letter-spacing:-.005em}
.t small{font-size:12.5px}
.alb,.dur{font-size:13.5px;font-variant-numeric:tabular-nums}
.row.now .t b,.row.now .num{color:var(--accent)}
.th .alb,.th .dur{font-size:11px}

/* busca */
.search{background:rgba(255,255,255,.05);border:1px solid var(--line);height:48px;border-radius:999px;transition:border-color .2s,background .2s}
.search:focus-within{border-color:rgba(184,163,255,.7);background:rgba(255,255,255,.07)}
.search input{font-size:15px;font-weight:400}
.search input::placeholder{color:var(--muted);font-weight:400}

/* player */
.player{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:0 18px}
.np b{font-weight:500;font-size:14px}
.np small{font-size:12px}
.np .cov{border-radius:8px}
.prog{font-size:11.5px;font-variant-numeric:tabular-nums}
.prog span{font-weight:400}
.play{background:var(--text);box-shadow:0 6px 18px rgba(0,0,0,.4)}
input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:3px;background:linear-gradient(90deg,var(--accent) var(--v),rgba(255,255,255,.16) var(--v))}
input[type=range]::-moz-range-track{height:3px;border-radius:3px;background:linear-gradient(90deg,var(--accent) var(--v),rgba(255,255,255,.16) var(--v))}
input[type=range]:hover::-webkit-slider-runnable-track{background:linear-gradient(90deg,var(--accent2) var(--v),rgba(255,255,255,.22) var(--v))}
input[type=range]:hover::-moz-range-track{background:linear-gradient(90deg,var(--accent2) var(--v),rgba(255,255,255,.22) var(--v))}
input[type=range]:hover::-webkit-slider-thumb{margin-top:-4.5px}

/* menus, fila, importação, aviso */
#menu,#queue,.impbox{background:#16161e;border:1px solid rgba(255,255,255,.09);border-radius:14px;box-shadow:0 24px 60px rgba(0,0,0,.6)}
#menu button{border-radius:8px;font-size:14px;font-weight:400}
#queue h3,.impbox h3{font-size:22px;margin:8px 0 10px}
#queue .lbl,#menu .lbl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.qi b,.impi b{font-weight:500}
.impi{border-radius:10px}
#toast{font-weight:500;font-size:13.5px;border-radius:999px;padding:10px 20px;box-shadow:0 12px 30px rgba(0,0,0,.45)}
.empty{font-size:14px}
.mnav button{font-weight:500;font-size:11px;letter-spacing:.02em}

@media(max-width:860px){
 .app{gap:0;padding:0}
 .box,.main{border-radius:0;border:0}
 .player{border-radius:0;border:0;border-top:1px solid var(--line);background:rgba(10,10,15,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
 .mnav{border-top:1px solid var(--line);background:rgba(8,8,12,.96)}
 .pad{padding:18px 16px 36px}
 .hero{padding:20px 16px 0}
 .bar{padding:18px 16px}
 h1{font-size:30px}
 h2{font-size:22px;margin:30px 0 14px}
}

/* ---------- compositor determinístico ---------- */
const SC={maj:[0,2,4,5,7,9,11],min:[0,2,3,5,7,8,10],dor:[0,2,3,5,7,9,10]};
const mtof=m=>440*Math.pow(2,(m-69)/12);
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const evCache={};
function compose(t){
 if(evCache[t.id])return evCache[t.id];
 const r=rng(t.seed),spb=60/t.bpm,bar=spb*4,bars=Math.floor(t.dur/bar),sc=SC[t.mode],ev=[];
 const deg=d=>sc[((d%7)+7)%7]+12*Math.floor(d/7);
 const progs=[[0,5,3,4],[0,3,4,0],[5,3,0,4],[0,4,5,3]];
 const prog=progs[t.seed%4];
 let md=7+Math.floor(r()*3);
 for(let b=0;b<bars;b++){
  const c=prog[b%4],t0=b*bar,fade=b>=bars-2?(b===bars-1?.35:.7):1;
  // pad
  [0,2,4].forEach(k=>ev.push({t:t0,dur:bar,f:mtof(t.root+deg(c+k)),k:"pad",v:.05*fade}));
  // baixo
  const bp=t.bass==="drive"?[0,.5,1,1.5,2,2.5,3,3.5]:t.bass==="walk"?[0,1.5,2,3]:[0,2];
  bp.forEach((p,i)=>{const d=(t.bass==="walk"&&i%2)?c+4:c;ev.push({t:t0+p*spb,dur:spb*(t.bass==="drive"?.45:1.5),f:mtof(t.root-24+deg(d)),k:"bass",v:.2*fade})});
  // bateria
  if(t.drums>0)for(let i=0;i<4;i++){
   if(t.drums===2||i%2===0)ev.push({t:t0+i*spb,k:"kick",v:.5*fade});
   if(i%2===1&&t.drums>=1)ev.push({t:t0+i*spb,k:"snare",v:.18*fade});
   ev.push({t:t0+(i+.5)*spb,k:"hat",v:.07*fade});
   if(t.drums===2)ev.push({t:t0+i*spb,k:"hat",v:.03*fade});
  }
  // melodia (entra a partir do compasso 3)
  if(b>=2&&b%8!==7){
   for(let s=0;s<8;s++){
    if(r()<.58){
     md+=Math.floor(r()*5)-2; md=Math.max(5,Math.min(13,md));
     const len=r()<.3?2:1;
     ev.push({t:t0+s*spb/2,dur:len*spb/2*.95,f:mtof(t.root+12+deg(md)),k:"lead",v:.075*fade});
     if(len===2)s++;
    }
   }
  }
 }
 ev.sort((a,b)=>a.t-b.t);
 return evCache[t.id]=ev;
}

/* ---------- motor de áudio ---------- */
let ctx,master,comp,noiseBuf,el;
function ensureAudio(){
 if(ctx){if(ctx.state==="suspended")ctx.resume();return}
 ctx=new (window.AudioContext||window.webkitAudioContext)();
 master=ctx.createGain();comp=ctx.createDynamicsCompressor();
 master.connect(comp);comp.connect(ctx.destination);
 noiseBuf=ctx.createBuffer(1,ctx.sampleRate,ctx.sampleRate);
 const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
 el=new Audio();el.preload="auto";
 el.onended=()=>onEnd();
 el.onloadedmetadata=()=>{if(S.cur&&S.cur.url&&isFinite(el.duration)){S.cur.dur=el.duration;paintPlayer()}};
 applyVol();
}
function applyVol(){
 const v=S.muted?0:S.vol;
 if(master)master.gain.value=v*v;
 if(el)el.volume=v;
 if(typeof SP!=="undefined"&&SP.player)try{SP.player.setVolume(v)}catch(e){}
}
function voice(bus,e,when){
 const c=ctx,g=c.createGain(),end=when+(e.dur||.2);
 g.connect(bus);
 if(e.k==="pad"){
  const lp=c.createBiquadFilter();lp.type="lowpass";lp.frequency.value=1400;lp.connect(g);
  [-6,6].forEach(dt=>{const o=c.createOscillator();o.type="sawtooth";o.frequency.value=e.f;o.detune.value=dt;o.connect(lp);o.start(when);o.stop(end+.6)});
  g.gain.setValueAtTime(0,when);g.gain.linearRampToValueAtTime(e.v,when+Math.min(1.2,e.dur*.4));
  g.gain.setValueAtTime(e.v,end-.2);g.gain.linearRampToValueAtTime(0,end+.5);
 }else if(e.k==="bass"){
  const o=c.createOscillator(),lp=c.createBiquadFilter();o.type="sawtooth";o.frequency.value=e.f;
  lp.type="lowpass";lp.frequency.setValueAtTime(900,when);lp.frequency.exponentialRampToValueAtTime(180,when+e.dur);
  o.connect(lp);lp.connect(g);o.start(when);o.stop(end+.1);
  g.gain.setValueAtTime(0,when);g.gain.linearRampToValueAtTime(e.v,when+.01);g.gain.exponentialRampToValueAtTime(.001,end);
 }else if(e.k==="lead"){
  const o=c.createOscillator(),o2=c.createOscillator(),lp=c.createBiquadFilter();
  o.type="triangle";o2.type="square";o.frequency.value=e.f;o2.frequency.value=e.f;o2.detune.value=4;
  const g2=c.createGain();g2.gain.value=.25;o2.connect(g2);g2.connect(lp);o.connect(lp);
  lp.type="lowpass";lp.frequency.value=3200;lp.connect(g);
  o.start(when);o2.start(when);o.stop(end+.25);o2.stop(end+.25);
  g.gain.setValueAtTime(0,when);g.gain.linearRampToValueAtTime(e.v,when+.015);g.gain.exponentialRampToValueAtTime(e.v*.4,when+.15);
  g.gain.setValueAtTime(e.v*.4,end);g.gain.exponentialRampToValueAtTime(.001,end+.22);
 }else if(e.k==="kick"){
  const o=c.createOscillator();o.type="sine";o.frequency.setValueAtTime(140,when);o.frequency.exponentialRampToValueAtTime(42,when+.12);
  o.connect(g);o.start(when);o.stop(when+.3);
  g.gain.setValueAtTime(e.v,when);g.gain.exponentialRampToValueAtTime(.001,when+.28);
 }else{ // snare / hat
  const n=c.createBufferSource(),f=c.createBiquadFilter();n.buffer=noiseBuf;
  f.type="highpass";f.frequency.value=e.k==="hat"?7000:1800;
  n.connect(f);f.connect(g);n.start(when,Math.random()*.5);n.stop(when+.2);
  const l=e.k==="hat"?.05:.16;
  g.gain.setValueAtTime(e.v,when);g.gain.exponentialRampToValueAtTime(.001,when+l);
 }
}
const synth={
 bus:null,timer:null,i:0,t0:0,off:0,ev:[],
 start(track,off){
  this.stop();
  this.ev=compose(track);this.off=off;this.t0=ctx.currentTime+.05;
  this.bus=ctx.createGain();this.bus.connect(master);
  this.i=this.ev.findIndex(e=>e.t>=off);if(this.i<0)this.i=this.ev.length;
  this.timer=setInterval(()=>this.tick(),40);this.tick();
 },
 time(){return this.off+Math.max(0,ctx.currentTime-this.t0)},
 tick(){
  const now=this.time();
  while(this.i<this.ev.length&&this.ev[this.i].t<now+.3){
   const e=this.ev[this.i++];
   voice(this.bus,e,Math.max(ctx.currentTime,this.t0+e.t-this.off));
  }
 },
 stop(){
  clearInterval(this.timer);this.timer=null;
  if(this.bus){const b=this.bus;b.gain.setTargetAtTime(0,ctx.currentTime,.02);setTimeout(()=>b.disconnect(),300);this.bus=null}
 }
};

 const keep=new Set([...S.liked,...S.recent,...S.playlists.flatMap(p=>p.ids)]);
 store.set("spm.cache",S.tracks.filter(t=>t.remote&&keep.has(t.id)));
};
const cover=(t,size)=>t.img?`<div class="cov" style="width:${size}px;height:${size}px;background:#222 url('${esc(t.img)}') center/cover"></div>`:coverGen(t,size);
const coverGen=(t,size)=>`<div class="cov" style="width:${size}px;height:${size}px;background:linear-gradient(135deg,hsl(${t.hue},70%,55%),hsl(${(t.hue+45)%360},65%,28%));font-size:${Math.round(size*.42)}px">${I.note.replace("<svg",'<svg style="width:1em;height:1em;opacity:.85"')}</div>`;
const mixCover=(h,size,txt)=>`<div class="cov" style="width:${size}px;height:${size}px;background:linear-gradient(135deg,hsl(${h},70%,52%),hsl(${(h+60)%360},65%,25%));font-size:${Math.round(size*.36)}px">${txt||I.note.replace("<svg",'<svg style="width:1em;height:1em;opacity:.85"')}</div>`;
const likedCover=size=>`<div class="cov" style="width:${size}px;height:${size}px;background:linear-gradient(135deg,#6b2cff,#d8e6ff);font-size:${Math.round(size*.42)}px">${I.heartOn.replace("<svg",'<svg style="width:1em;height:1em;color:#fff"')}</div>`;

/* playlists virtuais e do usuário */
function tagList(){return [...new Set(local().map(t=>t.tag))]}
function hueOf(s){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))%360;return h}
function getList(id){
 if(id==="liked")return{id,name:"Músicas Curtidas",ids:S.tracks.filter(t=>S.liked.has(t.id)).map(t=>t.id),kind:"liked",desc:"Suas músicas favoritas"};
 if(id==="pc:all")return{id,name:"Músicas do computador",ids:PC.ids.filter(T),kind:"mix",hue:200};
 if(id.startsWith("pc:a")){const al=PC.albums[+id.slice(4)];return al?{id,name:al.name,ids:al.ids.filter(T),kind:"mix",hue:hueOf(al.name)}:null}
 if(id.startsWith("src:")){const k=id.slice(4);return{id,name:k==="jm"?"Salvas do Jamendo":"Salvas do Spotify",ids:S.tracks.filter(t=>srcOf(t)===k).map(t=>t.id),kind:"mix",hue:hueOf(k)}}
 if(id.startsWith("sp:")){const ids=S.jmLists[id],m=S.spPls.find(p=>p.id===id);return{id,name:id==="sp:q"?"Busca no Spotify":(m?m.name:"Spotify"),ids:(ids||[]).filter(T),kind:"mix",hue:hueOf(id),loading:!ids}}
 if(id==="recent")return{id,name:"Tocadas recentemente",ids:S.recent.filter(T),kind:"mix",hue:280};
 if(id.startsWith("jm:")){const k=id.slice(3),ids=S.jmLists[k];return{id,name:JM_NAMES[k]||("Jamendo · "+k),ids:(ids||[]).filter(T),kind:"mix",hue:hueOf(k),loading:!ids}}
 if(id==="all")return{id,name:"Todas as músicas",ids:local().map(t=>t.id),kind:"mix",hue:300,desc:"Tudo do catálogo"};
 if(id.startsWith("mix:")){const tag=id.slice(4);return{id,name:"Mix "+tag,ids:local().filter(t=>t.tag===tag).map(t=>t.id),kind:"mix",hue:hueOf(tag),desc:"Seleção "+tag+" feita para você"}}
 const p=S.playlists.find(p=>p.id===id);
 return p?{id,name:p.name,ids:p.ids.filter(T),kind:"user",hue:hueOf(p.name),desc:"Playlist sua"}:null;
}

/* ---------- player ---------- */
function curDur(){return S.cur?(S.cur.url?(isFinite(el.duration)&&el.duration?el.duration:S.cur.dur||0):S.cur.dur):0}
function curTime(){
 if(!S.cur||!ctx)return 0;
 if(S.cur.sp)return (SP.pos+(S.playing&&!SP.paused?performance.now()-SP.stamp:0))/1000;
 if(S.cur.url)return el.currentTime||0;
 return S.playing?synth.time():S.pausedAt;
}
function engineStop(keepSp){if(synth.timer||synth.bus)synth.stop();if(el)el.pause();if(S.cur&&S.cur.sp&&!keepSp)spPause()}
function startTrack(t,off=0){
 ensureAudio();engineStop(t.sp);
 S.recent=[t.id,...S.recent.filter(x=>x!==t.id)].slice(0,12);saveUser();
 S.cur=t;S.playing=true;S.pausedAt=off;
 if(t.url){el.src=t.url;const go=()=>{if(off)el.currentTime=off};el.onloadedmetadata=()=>{go();if(isFinite(el.duration)){t.dur=el.duration}paintPlayer()};el.play().catch(()=>{});}
 else if(t.sp){SP.started=false;SP.maxPos=0;SP.gen=(SP.gen||0)+1;SP.pos=off*1000;SP.stamp=performance.now();SP.paused=false;try{SP.player&&SP.player.activateElement()}catch(e){}spPlay(t,off)}
 else synth.start(t,off);
 paintAll();
}
function playContext(ids,startId){
 ids=ids.filter(T);if(!ids.length)return;
 S.orig=ids.slice();startId=startId||ids[0];
 if(S.shuffle){const rest=ids.filter(i=>i!==startId);for(let i=rest.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[rest[i],rest[j]]=[rest[j],rest[i]]}S.queue=[startId,...rest];S.qi=0}
 else{S.queue=ids.slice();S.qi=S.queue.indexOf(startId)}
 startTrack(T(startId));
}
function togglePlay(){
 if(!S.cur){playContext(local().map(t=>t.id));return}
 ensureAudio();
 if(S.playing){
  if(S.cur.sp){SP.pos=curTime()*1000;SP.stamp=performance.now();SP.paused=true;spPause()}else if(S.cur.url)el.pause();else{S.pausedAt=synth.time();synth.stop()}
  S.playing=false;
 }else{
  if(S.cur.sp){SP.paused=false;SP.stamp=performance.now();spResume()}else if(S.cur.url)el.play().catch(()=>{});else synth.start(S.cur,S.pausedAt);
  S.playing=true;
 }
 paintPlayer();
}
function seekTo(s){
 if(!S.cur)return;
 if(S.cur.sp){SP.pos=s*1000;SP.stamp=performance.now();spSeek(Math.round(s*1000))}
 else if(S.cur.url){el.currentTime=s}
 else if(S.playing)synth.start(S.cur,s);else S.pausedAt=s;
}
function next(auto){
 if(!S.queue.length)return;
 let n=S.qi+1;
 if(n>=S.queue.length){
  if(S.repeat===1)n=0;
  else if(auto){engineStop();S.playing=false;S.pausedAt=0;if(S.cur.url)el.currentTime=0;paintPlayer();return}
  else n=0;
 }
 S.qi=n;startTrack(T(S.queue[n]));
}
function prev(){
 if(!S.queue.length)return;
 if(curTime()>3){seekTo(0);return}
 let n=S.qi-1;if(n<0)n=S.repeat===1?S.queue.length-1:0;
 S.qi=n;startTrack(T(S.queue[n]));
}
function onEnd(){
 if(S.repeat===2)startTrack(S.cur);else next(true);
}
function toggleShuffle(){
 S.shuffle=!S.shuffle;
 if(S.cur&&S.orig.length){
  if(S.shuffle){const rest=S.orig.filter(i=>i!==S.cur.id);for(let i=rest.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[rest[i],rest[j]]=[rest[j],rest[i]]}S.queue=[S.cur.id,...rest];S.qi=0}
  else{S.queue=S.orig.slice();S.qi=Math.max(0,S.queue.indexOf(S.cur.id))}
 }
 paintPlayer();
}
function toggleLike(id){
 if(S.liked.has(id)){S.liked.delete(id);toast("Removida das Músicas Curtidas")}else{S.liked.add(id);toast("Adicionada às Músicas Curtidas")}
 saveUser();render();paintPlayer();paintSide();
}

/* ---------- render: player ---------- */
function paintPlayer(){
 const t=S.cur;
 $("#np").innerHTML=t?`${cover(t,56)}<div><b>${esc(t.title)}</b><small>${esc(t.artist)}</small></div><button class="ib heart ${S.liked.has(t.id)?"on":""}" style="opacity:1;margin-left:6px" data-act="like" data-id="${t.id}" aria-label="Curtir">${S.liked.has(t.id)?I.heartOn:I.heart}</button>`:`<div style="color:var(--muted);font-size:13px">Escolha uma música para começar</div>`;
 $("#btns").innerHTML=`
  <button class="ib hide-m ${S.shuffle?"on":""}" data-act="shuffle" aria-label="Aleatório" title="Aleatório">${I.shuffle}</button>
  <button class="ib" data-act="prev" aria-label="Anterior">${I.prev}</button>
  <button class="play" data-act="toggle" aria-label="${S.playing?"Pausar":"Tocar"}">${S.playing?I.pause:I.play}</button>
  <button class="ib" data-act="next" aria-label="Próxima">${I.next}</button>
  <button class="ib hide-m ${S.repeat?"on":""}" data-act="repeat" aria-label="Repetir" title="Repetir">${S.repeat===2?I.repeat1:I.repeat}</button>`;
 $("#right").innerHTML=`<button class="ib" style="font-size:22px;${S.showQueue?"color:var(--accent)":""}" data-act="queue" aria-label="Fila" title="Fila">${I.queue}</button><button class="ib" style="font-size:22px" data-act="mute" aria-label="Volume">${S.muted||S.vol===0?I.mute:I.vol}</button><input type="range" id="vol" min="0" max="100" value="${Math.round(S.vol*100)}" aria-label="Volume">`;
 setRange($("#vol"));
 $("#td").textContent=fmt(curDur());paintQueue();
 document.querySelectorAll("[data-tid]").forEach(e=>e.classList.toggle("now",!!t&&e.dataset.tid===t.id));
}
function paintQueue(){
 const q=$("#queue");if(!q)return;
 q.style.display=S.showQueue?"block":"none";if(!S.showQueue)return;
 const cur=S.cur,nx=S.queue.slice(S.qi+1,S.qi+51);
 const row=(t,i)=>`<button class="qi" data-act="qplay" data-i="${i}">${cover(t,40)}<div><b>${esc(t.title)}</b><small>${esc(t.artist)}</small></div></button>`;
 q.innerHTML=`<h3>Fila</h3>`+(cur?`<div class="lbl">Tocando agora</div><div class="qi now">${cover(cur,40)}<div><b>${esc(cur.title)}</b><small>${esc(cur.artist)}</small></div></div>`:`<div class="lbl">A fila está vazia. Toque uma música para começar.</div>`)
  +(nx.length?`<div class="lbl">A seguir</div>`+nx.map((id,i)=>T(id)?row(T(id),S.qi+1+i):"").join(""):"");
}
function setRange(r){r.style.setProperty("--v",(r.value/(r.max||100))*100+"%")}
let dragging=false;
function tick(){
 if(!S.cur)return;
 const d=curDur(),c=curTime();
 if(S.playing&&!S.cur.url&&!S.cur.sp&&c>=S.cur.dur-.05){onEnd();return}
 $("#tc").textContent=fmt(c);
 if(!dragging&&d){const s=$("#seek");s.value=Math.round(c/d*1000);setRange(s)}
}
setInterval(tick,250);

/* ---------- Jamendo (opcional: precisa de client_id gratuito) ---------- */
let JMKEY=store.get("spm.jm","");
const JM_BASE="https://api.jamendo.com/v3.0";
const JM_TAGS=[["pop","Pop"],["rock","Rock"],["electronic","Eletrônica"],["hiphop","Hip-hop"],["jazz","Jazz"],["lounge","Lounge"],["ambient","Ambiente"],["classical","Clássica"],["metal","Metal"],["reggae","Reggae"],["chillout","Chillout"],["folk","Folk"]];
const JM_NAMES=Object.assign({popular:"Popular no Jamendo",q:"Busca no Jamendo"},Object.fromEntries(JM_TAGS.map(([k,n])=>[k,"Jamendo · "+n])));
const jmErr=()=>"Não consegui carregar o Jamendo. Confira sua chave (client_id) e a conexão.";
function jmTrack(x){
 const id="j"+x.id;let t=S.tracks.find(t=>t.id===id);
 if(!t){t={id,remote:true,title:x.name,artist:x.artist_name||"Artista",album:x.album_name||"Single",tag:"Jamendo",url:x.audio,img:x.image||x.album_image||"",dur:+x.duration||0,hue:hueOf(x.artist_name||x.name||"j")};S.tracks.push(t)}
 return t;
}
async function jmFetch(p){
 const u=new URL(JM_BASE+"/tracks/");
 const q=Object.assign({client_id:JMKEY,format:"json",limit:30,audioformat:"mp32",imagesize:300},p);
 for(const k in q)u.searchParams.set(k,q[k]);
 const r=await fetch(u),j=await r.json();
 if(j.headers&&j.headers.status!=="success")throw new Error(j.headers.error_message||"erro");
 return (j.results||[]).filter(x=>x.audio).map(jmTrack);
}
async function jmLoad(key){
 const ts=await jmFetch(key==="popular"?{order:"popularity_week"}:{tags:key,order:"popularity_total"});
 S.jmLists[key]=ts.map(t=>t.id);return ts;
}
async function ensureJm(id){
 const k=id.slice(3);if(S.jmLists[k]||k==="q")return;
 try{await jmLoad(k)}catch(e){toast(jmErr());S.jmLists[k]=[]}
 if(S.view.n==="pl"&&S.view.id===id)render();
}
async function fillJmHome(){
 if(!JMKEY||!$("#jm-home"))return;
 const draw=()=>{const b=$("#jm-home");if(!b)return;const l=getList("jm:popular");b.innerHTML=`<h2>Popular no Jamendo</h2><div class="grid">${l.ids.slice(0,12).map(i=>cardT(T(i),"jm:popular")).join("")}</div>`};
 if(S.jmLists.popular){draw();return}
 $("#jm-home").innerHTML=`<h2>Popular no Jamendo</h2><div class="empty">Carregando…</div>`;
 try{await jmLoad("popular");draw()}catch(e){const b=$("#jm-home");if(b)b.innerHTML=`<h2>Popular no Jamendo</h2><div class="empty">${jmErr()}</div>`}
}
let jmTimer;
function fillJmSearch(q,delay){
 const box=$("#jm-res");if(!box)return;
 q=q.trim();
 if(!JMKEY||!q||!srcOn("jm")){box.innerHTML="";return}
 const draw=()=>{const b=$("#jm-res");if(!b||(S.view.q||"").trim()!==q)return;const ids=S.jmQ.ids.filter(T);b.innerHTML=`<h2>No Jamendo</h2>`+(ids.length?listTable(ids,"jm:q"):`<div class="empty">Nada encontrado no Jamendo.</div>`)};

/* ---------- Spotify (login PKCE + Web Playback SDK; exige conta Premium) ---------- */
const SP=Object.assign({id:store.get("spm.sp.id",""),token:"",exp:0,refresh:"",player:null,deviceId:null,pos:0,stamp:0,paused:true,started:false,forceRemote:store.get("spm.sp.remote",false)},store.get("spm.sp.tok",{}));
const SP_REDIR=location.origin+location.pathname.replace(/index\.html$/,"");
const SP_SCOPES="streaming user-read-email user-read-private user-read-playback-state user-modify-playback-state playlist-read-private playlist-read-collaborative";
const spOn=()=>!!SP.refresh;
const SP_MOBILE=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)||(navigator.maxTouchPoints>1&&/Mac/i.test(navigator.platform||""));
const spRemote=()=>SP_MOBILE||!!SP.sdkFailed||!!SP.forceRemote;
const rand=n=>{const c="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~";return Array.from(crypto.getRandomValues(new Uint8Array(n)),b=>c[b%c.length]).join("")};
const b64url=buf=>btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
function spErr(e){return e&&e.status===403?"O Spotify recusou o acesso. Confira se sua conta é Premium e se você é o dono do app no painel do Spotify.":e&&e.status===429?"Muitas requisições ao Spotify. Tente de novo em instantes.":"Não consegui falar com o Spotify. Tente conectar de novo."}
function spConnect(){
 if(spOn()){if(confirm("Desconectar do Spotify?"))spLogout();return}
 const v=prompt("Para usar o Spotify:\n1) Crie um app em developer.spotify.com/dashboard\n2) Em Redirect URIs, adicione exatamente:\n"+SP_REDIR+"\n3) Marque Web API e Web Playback SDK\n4) Cole aqui o Client ID:",SP.id);
 if(v===null||!v.trim())return;
 SP.id=v.trim();store.set("spm.sp.id",SP.id);spLogin();
}
async function spLogin(){
 const ver=rand(64),st=rand(16);
 const ch=b64url(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(ver)));
 store.set("spm.sp.auth",{ver,st});
 location.href="https://accounts.spotify.com/authorize?"+new URLSearchParams({client_id:SP.id,response_type:"code",redirect_uri:SP_REDIR,scope:SP_SCOPES,code_challenge_method:"S256",code_challenge:ch,state:st});
}
async function spTokenReq(body){
 const r=await fetch("https://accounts.spotify.com/api/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:new URLSearchParams(Object.assign({client_id:SP.id},body))});
 const j=await r.json();
 if(!r.ok||!j.access_token)throw new Error(j.error_description||j.error||"erro");
 SP.token=j.access_token;SP.exp=Date.now()+j.expires_in*1000;if(j.refresh_token)SP.refresh=j.refresh_token;
 store.set("spm.sp.tok",{token:SP.token,exp:SP.exp,refresh:SP.refresh});
}
async function spCallback(){
 const q=new URLSearchParams(location.search);
 if(!q.has("code")&&!q.has("error"))return;
 const a=store.get("spm.sp.auth",null);
 try{history.replaceState({},"",SP_REDIR)}catch(e){}
 if(q.get("error")){toast("Login do Spotify cancelado");return}
 if(!a||q.get("state")!==a.st){toast("Login do Spotify inválido. Tente de novo.");return}
 try{await spTokenReq({grant_type:"authorization_code",code:q.get("code"),redirect_uri:SP_REDIR,code_verifier:a.ver});toast(SP_MOBILE?"Spotify conectado. Neste aparelho o Spotimy controla o app do Spotify, deixe-o instalado.":"Spotify conectado")}
 catch(e){toast("Não consegui conectar ao Spotify. Confira o Client ID e a Redirect URI.")}
 store.set("spm.sp.auth",null);
}
async function spToken(){
 if(SP.token&&Date.now()<SP.exp-60000)return SP.token;
 if(!SP.refresh){const e=new Error("sem login");e.status=401;throw e}
 try{await spTokenReq({grant_type:"refresh_token",refresh_token:SP.refresh})}
 catch(err){spLogout(true);const e=new Error("sessão expirada");e.status=401;throw e}
 return SP.token;
}
async function spApi(path,opt={}){
 const tok=await spToken();
 const r=await fetch("https://api.spotify.com/v1"+path,Object.assign({},opt,{headers:Object.assign({Authorization:"Bearer "+tok,"Content-Type":"application/json"},opt.headers||{})}));
 if(r.status===204)return null;
 let j=null;try{j=await r.json()}catch(e){}
 if(!r.ok){const e=new Error((j&&j.error&&j.error.message)||("HTTP "+r.status));e.status=r.status;throw e}
 return j;
}
function spLogout(silent){
 try{SP.player&&SP.player.disconnect()}catch(e){}
 if(S.cur&&S.cur.sp){S.playing=false;S.cur=null}
 SP.player=null;SP.deviceId=null;SP.token="";SP.refresh="";SP.exp=0;SP.pspP=null;
 store.set("spm.sp.tok",{});S.spPls=[];S.spLoaded=false;S.spQ={q:"",ids:[]};
 Object.keys(S.jmLists).forEach(k=>{if(k.startsWith("sp:"))delete S.jmLists[k]});
 toast(silent?"Sessão do Spotify expirada. Conecte de novo.":"Spotify desconectado");
 paintAll();render();
}
function spTrack(x){
 if(!x||!x.uri||!x.id||(x.type&&x.type!=="track")||x.is_local)return null;
 const id="s"+x.id;let t=S.tracks.find(t=>t.id===id);
 if(!t){
  const im=(x.album&&x.album.images)||[];
  t={id,remote:true,sp:true,uri:x.uri,title:x.name,artist:(x.artists||[]).map(a=>a.name).join(", ")||"Artista",album:(x.album&&x.album.name)||"",tag:"Spotify",img:(im[1]||im[0]||{}).url||"",dur:(x.duration_ms||0)/1000,hue:hueOf(x.name||"s")};
  S.tracks.push(t);
 }
 return t;
}
async function spSearch(q){
 const j=await spApi("/search?type=track&limit=10&q="+encodeURIComponent(q));
 return ((j&&j.tracks&&j.tracks.items)||[]).map(spTrack).filter(Boolean);
}
async function spPlaylists(){
 const j=await spApi("/me/playlists?limit=20");
 S.spPls=((j&&j.items)||[]).filter(Boolean).map(p=>({id:"sp:"+p.id,name:p.name||"Playlist",img:(p.images&&p.images[0]&&p.images[0].url)||"",n:(p.items&&p.items.total)??(p.tracks&&p.tracks.total)??0}));
 S.spLoaded=true;
}
async function spPlaylistTracks(pid){
 let j;
 try{j=await spApi(`/playlists/${pid}/items?limit=50`)}catch(e){j=await spApi(`/playlists/${pid}/tracks?limit=50`)}
 return ((j&&j.items)||[]).map(x=>spTrack(x&&(x.item||x.track))).filter(Boolean).map(t=>t.id);
}
async function ensureSp(id){
 if(S.jmLists[id]||id==="sp:q")return;
 try{S.jmLists[id]=await spPlaylistTracks(id.slice(3))}catch(e){toast(spErr(e));S.jmLists[id]=[]}
 if(S.view.n==="pl"&&S.view.id===id)render();
}
function ensureList(id){return id.startsWith("jm:")?ensureJm(id):id.startsWith("sp:")?ensureSp(id):Promise.resolve()}
async function fillSpHome(){
 if(!spOn()||!$("#sp-home"))return;
 const draw=()=>{const b=$("#sp-home");if(!b)return;
  b.innerHTML=S.spPls.length?`<h2>Suas playlists do Spotify</h2><div class="grid">${S.spPls.slice(0,12).map(p=>`<div class="card" data-pl="${esc(p.id)}" role="button" tabindex="0">${p.img?`<div class="cov" style="background:#222 url('${esc(p.img)}') center/cover"></div>`:mixCover(hueOf(p.name),200)}<button class="fab" data-act="playlist" data-id="${esc(p.id)}" aria-label="Tocar">${I.play}</button><b>${esc(p.name)}</b><small>${p.n?p.n+" músicas":"Playlist"}</small></div>`).join("")}</div>`:""};
 if(S.spLoaded){draw();return}

function spState(st){
 const cur=S.cur;if(!st||!cur||!cur.sp)return;
 const tw=st.track_window||{},ct=tw.current_track,prev=tw.previous_tracks||[];
 if(ct&&ct.uri===cur.uri){
  SP.pos=st.position;SP.stamp=performance.now();SP.paused=st.paused;
  if(st.duration)cur.dur=st.duration/1000;
  if(!st.paused)SP.started=true;
  const was=S.playing;S.playing=!st.paused;
  if(was!==S.playing)paintPlayer();
 }
 const dr=st.restrictions&&st.restrictions.disallow_resuming_reasons;
 if(SP.started&&st.paused&&st.position===0&&(prev.some(p=>p.uri===cur.uri)||(dr&&dr[0]==="not_paused"))){SP.started=false;onEnd()}
}
function spLoadSDK(){
 return SP.sdk||(SP.sdk=new Promise((res,rej)=>{
  window.onSpotifyWebPlaybackSDKReady=()=>res();
  const sc=document.createElement("script");sc.src="https://sdk.scdn.co/spotify-player.js";sc.onerror=()=>rej(new Error("sdk"));document.head.appendChild(sc);
 }));
}
function spPlayer(){
 if(SP.pp)return SP.pp;
 SP.pp=(async()=>{
  await spLoadSDK();
  return await new Promise((res,rej)=>{
   const p=new Spotify.Player({name:"Spotimy",getOAuthToken:cb=>spToken().then(cb).catch(()=>{}),volume:S.muted?0:S.vol});
   const fail=m=>{toast(m);rej(new Error(m))};
   p.addListener("ready",({device_id})=>{SP.player=p;SP.deviceId=device_id;res(p)});
   p.addListener("player_state_changed",spState);
   p.addListener("account_error",()=>fail("O player do Spotify exige conta Premium."));
   p.addListener("authentication_error",()=>fail("Falha de autenticação no Spotify. Conecte de novo."));
   p.addListener("initialization_error",()=>{SP.sdkFailed=true;fail("Este navegador não toca Spotify. Vou controlar o app do Spotify.")});
   p.connect();
   setTimeout(()=>rej(new Error("timeout")),15000);
  });
 })();
 SP.pp.catch(()=>{SP.pp=null});
 return SP.pp;
}

/* modo "controle remoto": toca no app do Spotify do aparelho (celular, tablet, caixa de som) */
async function spPickDevice(){
 let ds;
 try{const j=await spApi("/me/player/devices");ds=((j&&j.devices)||[]).filter(d=>!d.is_restricted)}catch(e){return null}
 const d=ds.find(d=>d.is_active)||ds.find(d=>/smartphone|tablet/i.test(d.type))||ds[0];
 if(!d){const e=new Error("sem aparelho");e.noDevice=true;throw e}
 SP.deviceId=d.id;return d.id;
}
let spPoll;
function spPollStart(){clearInterval(spPoll);spPoll=setInterval(spPollTick,1500)}
async function spPollTick(){
 const cur=S.cur;
 if(!spRemote()||!cur||!cur.sp){clearInterval(spPoll);return}
 const g=SP.gen;let st;
 try{st=await spApi("/me/player")}catch(e){return}
 if(g!==SP.gen||!S.cur||!S.cur.sp)return;
 spRemoteState(st);
}
function spRemoteState(st){
 const cur=S.cur;if(!cur||!cur.sp)return;
 const it=st&&st.item,end=cur.dur*1000-8000;
 if(it&&it.uri!==cur.uri){
  const idx=S.queue.findIndex((id,i)=>i>S.qi&&T(id)&&T(id).uri===it.uri);
  if(idx>=0&&SP.started){ // o Spotify seguiu sozinho para a próxima faixa da fila
   S.qi=idx;S.cur=T(S.queue[idx]);SP.maxPos=0;SP.pos=st.progress_ms||0;SP.stamp=performance.now();SP.paused=!st.is_playing;S.playing=!!st.is_playing;
   if(it.duration_ms)S.cur.dur=it.duration_ms/1000;
   S.recent=[S.cur.id,...S.recent.filter(x=>x!==S.cur.id)].slice(0,12);saveUser();paintAll();return;
  }
  if(SP.started&&SP.maxPos>end){SP.started=false;onEnd()}
  return;
 }
 if(!it){if(SP.started&&SP.maxPos>end){SP.started=false;onEnd()}return}
 SP.pos=st.progress_ms||0;SP.stamp=performance.now();SP.paused=!st.is_playing;
 if(it.duration_ms)cur.dur=it.duration_ms/1000;
 SP.maxPos=Math.max(SP.maxPos||0,SP.pos);
 if(st.is_playing)SP.started=true;
 const was=S.playing;S.playing=!!st.is_playing;if(was!==S.playing)paintPlayer();
 if(SP.started&&!st.is_playing&&SP.maxPos>end&&(SP.pos<2000||SP.pos>=cur.dur*1000-3000)){SP.started=false;onEnd()}
}
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&S.cur&&S.cur.sp&&spRemote())spPollTick()});
async function spPlay(t,off){
 const wasRemote=spRemote();
 try{
  let dev,uris=[t.uri];
  if(wasRemote){
   dev=await spPickDevice();
   if(S.repeat!==2&&S.queue[S.qi]===t.id){ // manda também as próximas faixas Spotify: continuam tocando mesmo com a tela bloqueada
    for(let i=S.qi+1;i<S.queue.length&&uris.length<30;i++){const n=T(S.queue[i]);if(n&&n.sp)uris.push(n.uri);else break}
   }
  }else{await spPlayer();dev=SP.deviceId}
  await spApi("/me/player/play"+(dev?"?device_id="+dev:""),{method:"PUT",body:JSON.stringify({uris,position_ms:Math.round(off*1000)})});
  if(wasRemote)spPollStart();
 }catch(e){
  if(!wasRemote&&e&&(e.message==="sdk"||e.message==="timeout"))SP.sdkFailed=true;
  if(!wasRemote&&spRemote()&&S.cur===t)return spPlay(t,off);
  if(S.cur===t){S.playing=false;paintPlayer()}
  toast(e&&(e.noDevice||e.status===404)?"Abra o app do Spotify neste aparelho, toque qualquer música uma vez e tente de novo.":e&&e.status?spErr(e):"Não consegui iniciar o Spotify.");
 }
}

/* ---------- Computador (servidor do Spotimy: toca direto de uma pasta do PC, sem importar) ---------- */
const PC={base:"",key:"",ok:false,ids:[],albums:[],n:0};
const pcOn=()=>PC.ok;
const canReach=b=>!(location.protocol==="https:"&&/^http:/i.test(b)&&!/^http:\/\/(localhost|127\.0\.0\.1)(:|\/|$)/i.test(b));
async function pcLoad(base,key){
 const r=await fetch(base+"/api/library"+(key?"?k="+encodeURIComponent(key):""));
 if(r.status===401){const e=new Error("senha");e.status=401;throw e}
 if(!r.ok)throw new Error("http "+r.status);
 const j=await r.json();
 const ex=new Map(S.tracks.filter(t=>t.pc).map(t=>[t.id,t]));
 const ids=[],groups=new Map();
 (j.tracks||[]).forEach(x=>{
  const id="c"+x.id,url=base+"/files/"+x.id+(key?"?k="+encodeURIComponent(key):"");
  let t=ex.get(id);
  if(t){t.url=url;t.title=x.title;t.artist=x.artist;t.album=x.album}
  else{t={id,remote:true,pc:true,title:x.title,artist:x.artist,album:x.album,tag:"Computador",url,dur:0,hue:hueOf(x.album)};S.tracks.push(t)}
  ids.push(id);
  if(!groups.has(x.album))groups.set(x.album,[]);
  groups.get(x.album).push(id);
 });
 PC.base=base;PC.key=key;PC.ok=true;PC.ids=ids;PC.n=ids.length;
 PC.albums=[...groups].map(([name,ids])=>({name,ids}));
 store.set("spm.pc",{base,key});
}
async function pcInit(){
 const saved=store.get("spm.pc",null);
 const cands=[];
 if(window.SPOTIMY_SERVER)cands.push({base:location.origin,key:saved&&saved.base===location.origin?saved.key:""});
 else if(saved&&canReach(saved.base))cands.push(saved);
 for(const c of cands){
  try{await pcLoad(c.base,c.key);break}
  catch(e){if(e.status===401&&window.SPOTIMY_SERVER)toast("A biblioteca do computador pede senha. Toque em Computador para entrar.")}
 }
 render();paintSide();
}
async function pcConnect(){
 if(pcOn()){if(confirm("Desconectar do computador? As músicas saem do app, os arquivos continuam lá."))pcLogout();return}
 const def=PC.base||(window.SPOTIMY_SERVER?location.origin:"http://");
 let base=prompt("Endereço do servidor no seu computador.\nExemplo: http://192.168.0.10:8765\n(o endereço aparece na janela do servidor)",def);
 if(base===null)return;
 base=base.trim().replace(/\/+$/,"");if(!base)return;
 if(!/^https?:\/\//i.test(base))base="http://"+base;
 if(!canReach(base)){alert("Esta página usa https e o navegador bloqueia o endereço "+base+".\n\nAbra o Spotimy pelo endereço do seu computador, o mesmo que o servidor mostra (começa com http://).");return}
 let key=PC.key||"";
 for(let tries=0;tries<4;tries++){
  try{await pcLoad(base,key);toast(PC.n+" músicas do computador");render();paintSide();return}
  catch(e){
   if(e.status===401){
    if(tries===3){toast("Senha incorreta.");return}
    const k=prompt(tries?"Senha incorreta. Tente de novo:":"Este servidor pede senha:","");if(k===null)return;key=k;continue;
   }
   toast("Não consegui falar com o servidor. Confira se ele está rodando, o Wi-Fi e o endereço.");return;
  }
 }
}

 const c=l.kind==="liked"?likedCover(200):mixCover(l.hue,200);
 const total=l.ids.reduce((a,i)=>a+(T(i).dur||0),0);
 const playing=S.playing&&S.cur&&l.ids.includes(S.cur.id)&&S.orig.join()===l.ids.join();
 return `<div class="hero" style="background:linear-gradient(180deg,hsla(${l.hue??300},60%,35%,.7),transparent)">${c}<div><small>${l.kind==="user"?"PLAYLIST":l.kind==="liked"?"PLAYLIST":"MIX"}</small><h1>${esc(l.name)}</h1><p>${l.ids.length} músicas${total?" · "+Math.round(total/60)+" min":""}</p></div></div>
 <div class="bar"><button class="big" data-act="playlist" data-id="${esc(l.id)}" aria-label="Tocar">${playing?I.pause:I.play}</button>
  <button class="ib ${S.shuffle?"on":""}" style="${S.shuffle?"color:var(--accent)":""}" data-act="shuffle" aria-label="Aleatório">${I.shuffle}</button>
  ${l.kind==="user"?`<button class="ib" data-act="rename" data-id="${esc(l.id)}" style="font-size:15px;font-weight:500">Renomear</button><button class="ib" data-act="delpl" data-id="${esc(l.id)}" style="font-size:15px;font-weight:500">Excluir</button>`:""}</div>
 <div class="pad" style="padding-top:0">${l.loading?`<div class="empty">Carregando…</div>`:listTable(l.ids,l.id)}</div>`;
}
function render(){
 if((S.srcF==="jm"&&!JMKEY)||(S.srcF==="sp"&&!spOn())||(S.srcF==="pc"&&!pcOn()))S.srcF="all";
 const m=$("#main"),sc=m.scrollTop;
 m.innerHTML=S.view.n==="home"?viewHome():S.view.n==="search"?viewSearch():S.view.n==="library"?viewLibrary():viewList();
 m.scrollTop=sc;
 document.querySelectorAll("[data-tid]").forEach(e=>e.classList.toggle("now",!!S.cur&&e.dataset.tid===S.cur.id));
 if(S.view.n==="home"){fillPcHome();fillJmHome();fillSpHome()}
 if(S.view.n==="search"){fillJmSearch(S.view.q||"",0);fillSpSearch(S.view.q||"",0)}
}
function go(n,extra={}){S.view=Object.assign({n},extra);$("#main").scrollTop=0;render();if(n==="pl"&&/^(jm|sp):/.test(String(extra.id)))ensureList(extra.id);paintNav();paintSide();if(n==="search")setTimeout(()=>{const q=$("#q");if(q&&!extra.q)q.focus()},0)}

/* ---------- menu / toast ---------- */
const menu=$("#menu");
function hideMenu(){menu.style.display="none"}
function showMenu(x,y,html){
 menu.innerHTML=html;menu.style.display="block";
 const w=menu.offsetWidth,h=menu.offsetHeight;
 menu.style.left=Math.max(8,Math.min(x,innerWidth-w-8))+"px";
 menu.style.top=Math.max(8,Math.min(y,innerHeight-h-8))+"px";
}
let tt;function toast(m){const e=$("#toast");e.textContent=m;e.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>e.classList.remove("on"),1800)}
function trackMenu(x,y,id,ctxId){
 const l=getList(ctxId);const inUser=l&&l.kind==="user";
 showMenu(x,y,`<div class="lbl">Adicionar à playlist</div>`+
  S.playlists.map(p=>`<button data-act="addto" data-pid="${esc(p.id)}" data-id="${id}">${esc(p.name)}${p.ids.includes(id)?" ✓":""}</button>`).join("")+
  `<button data-act="newpl" data-id="${id}">+ Nova playlist</button><hr>`+
  `<button data-act="like" data-id="${id}">${S.liked.has(id)?"Remover das curtidas":"Curtir"}</button>`+
  (inUser?`<button data-act="rmfrom" data-pid="${esc(ctxId)}" data-id="${id}">Remover desta playlist</button>`:"")+(T(id)&&T(id).local?`<button data-act="rmlocal" data-id="${id}">Excluir do Spotimy</button>`:""));
}
function newPlaylist(addId){
 const name=(prompt("Nome da playlist:","Minha playlist nº "+(S.playlists.length+1))||"").trim();
 if(!name)return;
 const p={id:"p"+Date.now(),name:name.slice(0,60),ids:addId?[addId]:[]};
 S.playlists.push(p);saveUser();paintSide();render();toast("Playlist criada");
 if(!addId)go("pl",{id:p.id});
}

/* ---------- arquivos locais (salvos neste navegador via IndexedDB) ---------- */
const DB={
 open(){return this.p||(this.p=new Promise((res,rej)=>{const r=indexedDB.open("spotimy",1);r.onupgradeneeded=()=>r.result.createObjectStore("files",{keyPath:"id"});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}))},
 async tx(mode,fn){const db=await this.open();return new Promise((res,rej)=>{const t=db.transaction("files",mode),rq=fn(t.objectStore("files"));t.oncomplete=()=>res(rq&&rq.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})},
 put(rec){return this.tx("readwrite",s=>s.put(rec))},
 del(id){return this.tx("readwrite",s=>s.delete(id))},
 all(){return this.tx("readonly",s=>s.getAll())}
};
function addLocal(rec){
 const url=URL.createObjectURL(rec.blob);
 const t={id:rec.id,local:true,title:rec.title,artist:rec.artist,album:rec.album,tag:"Local",url,dur:rec.dur||0,hue:rec.hue};
 S.tracks.push(t);
 if(!t.dur){const a=new Audio();a.preload="metadata";a.src=url;a.onloadedmetadata=()=>{t.dur=a.duration;rec.dur=a.duration;DB.put(rec).catch(()=>{});render()}}
 return t;
}
const AUDIO_EXT=/\.(mp3|m4a|aac|wav|ogg|oga|opus|flac|weba)$/i;
const MIME={mp3:"audio/mpeg",m4a:"audio/mp4",aac:"audio/aac",wav:"audio/wav",ogg:"audio/ogg",oga:"audio/ogg",opus:"audio/ogg",flac:"audio/flac",weba:"audio/webm"};
const isAudio=f=>(f.type&&f.type.startsWith("audio/"))||AUDIO_EXT.test(f.name);
function guess(f){
 const base=f.name.replace(/\.[^.]+$/,""),m=base.split(/\s+-\s+/),parts=(f.webkitRelativePath||"").split("/");
 return{file:f,size:f.size,title:(m.length>1?m.slice(1).join(" - "):base).trim()||base,artist:m.length>1?m[0].trim():"Arquivo local",album:parts.length>1?parts[parts.length-2]:"Meus arquivos",checked:true};
}
let imp=[];
function openImport(files){
 const list=[...files].filter(isAudio);
 if(!list.length){toast("Nenhum arquivo de áudio encontrado");return}
 if(list.length===1){importItems([guess(list[0])]);return}
 imp=list.map(guess).sort((x,y)=>x.album.localeCompare(y.album)||x.title.localeCompare(y.title));
 paintImport();
}
function paintImport(){
 const m=$("#imp");
 if(!imp.length){m.style.display="none";m.innerHTML="";return}
 m.style.display="flex";
 m.innerHTML=`<div class="impbox" role="dialog" aria-label="Importar músicas"><h3>Importar ${imp.length} músicas</h3>
  <div class="impbar"><button class="chip" data-act="imp-all">Selecionar todos</button><button class="chip" data-act="imp-none">Limpar</button><span id="impn"></span></div>
  <div class="implist">${imp.map((i,k)=>`<label class="impi"><input type="checkbox" data-k="${k}" ${i.checked?"checked":""}><div><b>${esc(i.title)}</b><small>${esc(i.artist)} · ${esc(i.album)} · ${(i.size/1048576).toFixed(1)} MB</small></div></label>`).join("")}</div>
  <div class="impbtn"><button class="chip" data-act="imp-cancel">Cancelar</button><button class="chip on" id="impgo" data-act="imp-go"></button></div></div>`;
 updImp();
}
function updImp(){
 const n=imp.filter(i=>i.checked).length;
 const a=$("#impn"),g=$("#impgo");if(!a||!g)return;
 a.textContent=n+" de "+imp.length+" selecionadas";g.textContent="Importar "+n;g.disabled=!n;
}
async function importItems(items){
 let n=0,unsaved=0;
 for(const [i,it] of items.entries()){
  const f=it.file,ext=((f.name.match(/\.([^.]+)$/)||[])[1]||"").toLowerCase();
  const blob=f.type?f:new Blob([f],{type:MIME[ext]||"audio/mpeg"});
  const rec={id:"l"+Date.now()+"_"+i,title:it.title,artist:it.artist,album:it.album,hue:hueOf(it.title+it.album),dur:0,blob};
  try{await DB.put(rec)}catch(err){unsaved++}
  addLocal(rec);n++;
  if(items.length>4&&i%4===3)toast("Importando… "+(i+1)+" de "+items.length);
 }
 toast(unsaved?"Adicionadas, mas o navegador não permitiu salvar (valem só nesta sessão)":n+(n>1?" músicas salvas":" música salva")+" neste navegador");
 paintSide();render();
}
$("#file").addEventListener("change",e=>{const f=[...e.target.files];e.target.value="";openImport(f)});
$("#dir").addEventListener("change",e=>{const f=[...e.target.files];e.target.value="";openImport(f)});
async function removeLocal(id){
 const t=T(id);if(!t||!t.local)return;
 if(!confirm("Excluir \""+t.title+"\" do Spotimy? O arquivo original no seu aparelho não é apagado."))return;
 if(S.cur&&S.cur.id===id){engineStop();S.playing=false;S.cur=null;S.pausedAt=0}
 S.queue=S.queue.filter(x=>x!==id);S.orig=S.orig.filter(x=>x!==id);
 S.qi=S.cur?S.queue.indexOf(S.cur.id):-1;
 S.liked.delete(id);S.recent=S.recent.filter(x=>x!==id);S.playlists.forEach(p=>p.ids=p.ids.filter(x=>x!==id));
 S.tracks=S.tracks.filter(x=>x.id!==id);URL.revokeObjectURL(t.url);
 try{await DB.del(id)}catch(err){}
 saveUser();paintAll();render();toast("Música excluída");
}

/* ---------- eventos ---------- */
document.addEventListener("click",e=>{
 const a=e.target.closest("[data-act]");
 if(!e.target.closest("#menu")&&!(a&&a.dataset.act==="menu"))hideMenu();
 if(a){
  const act=a.dataset.act,id=a.dataset.id;
  if(act==="playrow"&&e.target.closest("button.heart,button.more"))return handleAct(e.target.closest("[data-act]"),e);
  e.stopPropagation&&0;
  return handleAct(a,e);
 }
 const sc=e.target.closest("[data-src]");if(sc)return setSrc(sc.dataset.src);
 const g=e.target.closest("[data-go]");if(g)return go(g.dataset.go);
 const p=e.target.closest("[data-pl]");if(p)return go("pl",{id:p.dataset.pl});
 const q=e.target.closest("[data-q]");if(q){S.view.q=q.dataset.q;render();return}
});
function handleAct(a,e){
 const act=a.dataset.act,id=a.dataset.id;
 switch(act){
  case"toggle":togglePlay();break;
  case"next":next(false);break;
  case"prev":prev();break;
  case"shuffle":toggleShuffle();if(S.view.n==="pl")render();break;
  case"repeat":S.repeat=(S.repeat+1)%3;paintPlayer();break;
  case"mute":S.muted=!S.muted;applyVol();paintPlayer();break;
  case"like":e.stopPropagation();toggleLike(id);break;
  case"playone":{const l=a.dataset.ctx?getList(a.dataset.ctx):null;playContext(l&&l.ids.length?l.ids:local().map(t=>t.id),id);break}
  case"queue":S.showQueue=!S.showQueue;paintPlayer();break;
  case"qplay":{const i=+a.dataset.i;if(S.queue[i]){S.qi=i;startTrack(T(S.queue[i]))}break}
  case"spotify":spConnect();break;
  case"spmode":SP.forceRemote=!SP.forceRemote;store.set("spm.sp.remote",SP.forceRemote);toast(SP.forceRemote?"O Spotimy vai controlar o app do Spotify":"O Spotify vai tocar neste navegador");render();break;
  case"jamendo":{const v=prompt("Cole seu client_id do Jamendo (grátis em devportal.jamendo.com).\nDeixe vazio para desconectar:",JMKEY);if(v===null)break;JMKEY=v.trim();store.set("spm.jm",JMKEY);S.jmLists={};S.jmQ={q:"",ids:[]};toast(JMKEY?"Jamendo conectado":"Jamendo desconectado");render();break}
  case"playrow":{const l=getList(a.dataset.ctx);const ids=l?l.ids:[...document.querySelectorAll("#main .row")].map(r=>r.dataset.tid);playContext(ids.length?ids:local().map(t=>t.id),id);break}
  case"playlist":{e.stopPropagation();const l=getList(id);if(!l)break;if(l.loading){ensureList(id).then(()=>{const l2=getList(id);if(l2.ids.length)playContext(l2.ids)});break}
   const same=S.cur&&S.orig.join()===l.ids.join();
   if(same&&S.cur)togglePlay();else playContext(l.ids);
   if(S.view.n==="pl")render();break}
  case"menu":{e.stopPropagation();const r=a.getBoundingClientRect();trackMenu(r.left-200,r.bottom+4,id,a.dataset.ctx);break}
  case"addto":{const p=S.playlists.find(p=>p.id===a.dataset.pid);if(p&&!p.ids.includes(id)){p.ids.push(id);saveUser();paintSide();render();toast("Adicionada a "+p.name)}else toast("Já está nessa playlist");hideMenu();break}
  case"rmlocal":hideMenu();removeLocal(id);break;
  case"rmfrom":{const p=S.playlists.find(p=>p.id===a.dataset.pid);if(p){p.ids=p.ids.filter(x=>x!==id);saveUser();paintSide();render();toast("Removida da playlist")}hideMenu();break}
  case"newpl":hideMenu();newPlaylist(id);break;
  case"addfiles":$("#file").click();break;
  case"pc":pcConnect();break;
  case"adddir":$("#dir").click();break;
  case"imp-all":imp.forEach(i=>i.checked=true);paintImport();break;
  case"imp-none":imp.forEach(i=>i.checked=false);paintImport();break;
  case"imp-cancel":imp=[];paintImport();break;
  case"imp-go":{const sel=imp.filter(i=>i.checked);imp=[];paintImport();if(sel.length)importItems(sel);break}
  case"rename":{const p=S.playlists.find(p=>p.id===id);const n=p&&(prompt("Novo nome:",p.name)||"").trim();if(n){p.name=n.slice(0,60);saveUser();paintSide();render()}break}
  case"delpl":{if(confirm("Excluir esta playlist?")){S.playlists=S.playlists.filter(p=>p.id!==id);saveUser();go("library")}break}
 }
}
document.addEventListener("keydown",e=>{
 const tag=(e.target.tagName||"").toLowerCase();
 if(e.key==="Enter"&&(e.target.classList.contains("card"))){e.target.click();return}
 if(tag==="input"&&e.target.type!=="range")return;
 if(e.code==="Space"){e.preventDefault();togglePlay()}
 else if(e.key==="ArrowRight"&&e.shiftKey)next(false);
 else if(e.key==="ArrowLeft"&&e.shiftKey)prev();
 else if(e.key==="ArrowRight"&&S.cur&&tag!=="input"){seekTo(Math.min(curDur(),curTime()+5))}
 else if(e.key==="ArrowLeft"&&S.cur&&tag!=="input"){seekTo(Math.max(0,curTime()-5))}
});
document.addEventListener("input",e=>{
 if(e.target.id==="seek"){dragging=true;setRange(e.target);$("#tc").textContent=fmt(e.target.value/1000*curDur())}
 else if(e.target.id==="vol"){S.vol=e.target.value/100;S.muted=false;applyVol();setRange(e.target);store.set("spm.vol",S.vol);$("#right [data-act=mute]").innerHTML=S.vol===0?I.mute:I.vol}
 else if(e.target.id==="q"){S.view.q=e.target.value;$("#results").innerHTML=resultsHTML(S.view.q);fillJmSearch(S.view.q,450);fillSpSearch(S.view.q,450)}
});
document.addEventListener("change",e=>{
 if(e.target.dataset&&e.target.dataset.k!==undefined&&imp[+e.target.dataset.k]){imp[+e.target.dataset.k].checked=e.target.checked;updImp();return}
 if(e.target.id==="seek"){seekTo(e.target.value/1000*curDur());dragging=false}
});
$("#main").addEventListener("scroll",hideMenu);
addEventListener("resize",hideMenu);

/* ---------- boot ---------- */
paintAll();render();
pcInit();
spCallback().then(()=>{if(spOn()&&!spRemote())spPlayer().catch(()=>{});render();paintSide()});
DB.all().then(rs=>{let n=0;rs.forEach(r=>{if(!T(r.id)){addLocal(r);n++}});if(n){paintSide();render()}}).catch(()=>{});
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
</script>
</body>
