<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>UP TV</title>

<style>
*{box-sizing:border-box}

html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
background:#000;
color:#fff;
font-family:Arial,sans-serif
}

:root{
--pink:#ff1493;
--panel:#0d0d12;
--line:#292933;
--muted:#999
}

.app{
height:100dvh;
display:grid;
grid-template-rows:1fr auto
}

.main{
position:relative;
min-height:0;
overflow:hidden
}

.top{
position:absolute;
z-index:3;
top:clamp(18px,3vw,40px);
left:clamp(20px,4vw,60px);
color:var(--pink);
font-weight:700;
letter-spacing:.16em;
font-size:clamp(12px,1.4vw,20px)
}

.status{
position:absolute;
z-index:3;
right:25px;
top:25px;
color:#777;
font-size:12px
}

.slide{
position:absolute;
inset:0;
padding:10vh 8vw 30px;
display:flex;
align-items:center;
opacity:0;
transform:translateX(3%);
transition:.7s
}

.slide.active{
opacity:1;
transform:none
}

.content{
max-width:1250px
}

.kicker{
color:var(--pink);
font-weight:700;
letter-spacing:.15em;
font-size:clamp(12px,1.3vw,20px);
margin-bottom:18px
}

h1{
font-size:clamp(32px,5.5vw,84px);
line-height:1.02;
letter-spacing:-.04em;
margin:0 0 22px;
max-width:1200px
}

.desc{
font-size:clamp(16px,2vw,28px);
line-height:1.35;
color:#d5d5db;
max-width:950px
}

.source{
color:#85858d;
font-size:clamp(11px,1.1vw,16px);
margin-top:22px
}

.dots{
position:absolute;
right:25px;
top:50%;
display:flex;
flex-direction:column;
gap:10px
}

.dot{
width:7px;
height:7px;
border-radius:50%;
background:#555
}

.dot.active{
background:var(--pink);
transform:scale(1.5)
}

.footer{
display:grid;
grid-template-columns:1.15fr repeat(4,1fr);
background:var(--panel);
border-top:1px solid var(--line)
}

.box{
min-height:90px;
padding:14px 20px;
border-right:1px solid var(--line);
display:flex;
flex-direction:column;
justify-content:center
}

.box:last-child{
border:0
}

.label{
font-size:11px;
letter-spacing:.15em;
color:#85858e;
margin-bottom:7px
}

.value{
font-size:clamp(20px,2.1vw,31px);
font-weight:700
}

.sub{
font-size:11px;
color:#777;
margin-top:4px
}

.logo-box{
text-align:center;
align-items:center
}

.logo{
font-size:clamp(28px,3vw,44px);
font-weight:800;
letter-spacing:-.05em
}

.logo span{
color:var(--pink)
}

.caption{
font-size:9px;
color:#777;
letter-spacing:.18em
}

.ticker{
height:58px;
background:var(--pink);
color:#000;
display:flex;
align-items:center;
gap:25px;
padding:10px 3vw;
overflow:hidden
}

.ticker b{
font-size:12px;
letter-spacing:.15em
}

.ticker span{
font-size:clamp(14px,1.5vw,22px);
font-weight:700;
overflow:hidden;
text-overflow:ellipsis;
white-space:nowrap
}

@media(max-width:700px){

.slide{
padding:18vh 22px 30px;
align-items:flex-start
}

.status{
top:20px;
right:18px
}

.footer{
grid-template-columns:1fr 1fr
}

.logo-box{
grid-column:1/-1;
min-height:64px
}

.box{
min-height:70px;
padding:10px 14px
}

.ticker{
height:52px;
padding:8px 14px
}

.ticker b{
display:none
}

.dots{
right:12px
}

}
</style>
</head>

<body>

<div class="app">

<main class="main">

<div class="top">UP TV • AO VIVO</div>

<div class="status" id="status">
iniciando...
</div>

<section class="slide active">

<div class="content">

<div class="kicker">UP TV</div>

<h1>
Painel de notícias para televisão.
</h1>

<div class="desc">
As principais manchetes do dia em uma tela automática, responsiva e preparada para TV, computador e celular.
</div>

<div class="source">
